# Global defaults for every mirror instance and service.
#
# A value lives here iff every deployment of that service carries the same
# number (workspace conventions: cadences, ring sizes). Values that describe
# one deployment (topology, chain sources, pins, watchlists, budgets, batch
# and log-range chunk sizes, the Iris fast-burn allowance) live in
# config/instances/<name>/instance.toml. Protocol facts and measured
# conventions are code constants, not configuration.
#
# Merge semantics: deep merge, defaults <- instance <- env; arrays replace,
# never concatenate; unknown keys are errors at every level.

# The shared endpoint pool policy: every lane (JSON-RPC, REST, WS, beacon)
# reads this table. A failed endpoint cools for an exponentially growing
# window; one jittered emergency probe is allowed while every endpoint cools;
# the per-call attempt budget bounds the whole rotation.
[endpoint_defaults]
rounds = 4
max_attempts = 12
cooldown_base_ms = 1000
cooldown_max_ms = 60000
jitter_ms = 250
emergency_probe = true
emergency_probe_ms = 1000

[chains.l1]
# Replay this many blocks behind the follow head. Blob sidecars for the
# newest block are not in the beacon yet (measured: >15 s of retries on
# ~every blob block), so the applier would hold T and retry on every blob
# block. A 2-block margin costs ~24 s of lag and removes the stall.
follow_margin_blocks = 2

[services.engine]
# The boot wait for the devnet chain (reth unwinding and an anvil re-forking
# both take minutes on a bad source day; a crash-loop is worse than a slow
# boot). The venue instance pins its own, shorter budget.
boot_timeout_secs = 900
# The drift log's rotation threshold (one retained generation beside the live
# file). A deployment's forensic-retention policy, not a protocol constant.
drift_rotate_bytes = 16777216

[services.engine.reth]
request_timeout_secs = 30

[services.engine.loops]
poll_interval_ms = 1000
# Refuse to catch up when the follow head is further than this ahead of the
# cursor: the plan's ops rule ("> 300 -> pause and re-sync"). A *rebased*
# cursor (a fresh pin after a restart or a T re-fork) is exempt and may
# replay its whole pin window, bounded by reth's 10,064-block state window -
# otherwise a T restart could never warm up.
max_gap_blocks = 300
# `chunk_size` (JSON-RPC batch items) is a deployment's endpoint contract, not
# a global default: it lives in each instance's `[services.engine.loops]`.
# Prepend rounds: devnet txs mined in their own block before the parent's
# diffs land (T only; the venue sets 0). A steady stream must not starve the
# parent block, so the drain is bounded by this explicit round budget.
prepend_rounds = 3
# The follow-status heartbeat (one line per interval).
status_log_interval_ms = 60000

[services.engine.verifier]
# Each applied block is verified against the source: the BAL carries the
# source's authoritative post-state (reth rejects a block whose BAL mismatches
# execution), and the applier re-checks its own application — `sweep =
# "sampled"` re-reads `drift_sample_keys` every block, `sweep = "full"`
# re-reads every applied key (conformance-grade: expensive; audits and re-pin
# validation).
drift_sample_keys = 8
sweep = "sampled"

[services.engine.source_sync]
# The sync runs when the instance supplies both the engine API endpoint and
# the JWT path below (presence is the switch; the section without them is
# inert).
interval_ms = 1000
# Payloads delivered per pass (each is a full block execution).
max_per_pass = 256
# Backoff after a top-up fault.
error_backoff_ms = 5000
# The periodic report (gap gauge + log line) cadence.
report_interval_ms = 5000
# The Engine API request budget (one `newPayload` executes a block).
request_timeout_secs = 180

[services.engine.journal]
blocks = 1024

[services.engine.beacon]
# Beacon-API base URLs, tried in order (local Lighthouse first). The top-up
# loop is the only reader (EIP-8379); the instance supplies the URL.
urls = []
# The beacon REST request budget.
request_timeout_secs = 30

[services.engine.http]
addr = "0.0.0.0"

# ---- the venue profile ----------------------------------------------------
# The venue engine is the same `[services.engine]` section: its
# driver reads the shared `loops`/`journal`/`verifier` sub-sections, so the
# cadence, write chunk and journal ring live here once for both profiles.

# ---- the venue simulator (profile "venue") -------------------------------
# The market plane's REST cache cadence. WS pushes (allMids, activeAssetCtx)
# are the primary freshness source; the REST poller backfills meta/books and
# is gated by the rate budget meter (1200 weight/min: metaAndAssetCtxs = 20,
# spotMeta = 20, l2Book/allMids = 2). 5 s gives ~600 weight/min for the
# default four-market set (20+20+4x2+2 = 50 per pass, 12 passes/min).
[services.venue_sim]
poll_interval_ms = 5000
# The account plane's self-advance tick (funding, liquidations, persist).
tick_interval_ms = 1000
# The `orderStatus` terminal-history bound (a deployment memory policy).
terminal_orders = 1024
# The Core↔EVM bridge's scan cadence (one pass per interval).
bridge_poll_interval_ms = 1000
# The devnet gas stipend written to the Core↔EVM system address when it has
# no native balance (the fork's system txs pay gas; the real chain's do not).
system_gas_stipend_wei = "1000000000000000000"
# The market-plane heartbeat log cadence.
heartbeat_interval_secs = 60
# HTTP timeouts: the venue `/info` lane, the simulator's RPC reads, and the
# engine's admin call.
rest_timeout_secs = 10
rpc_timeout_secs = 30
admin_timeout_secs = 45

[services.venue_sim.info]
addr = "0.0.0.0"

[services.venue_sim.control]
addr = "0.0.0.0"

# ---- the CCTP bridge (optional; either profile) ----------------------------
# The bridge spans both mirrors: T (Ethereum, domain 0) and V (HyperEVM,
# domain 19) over the real CCTP V2 contracts. Its stub is kept only when an
# instance declares [services.cctp_bridge] (the deployment that runs it); the
# chain endpoints, the relay key and the attester seed are deployment facts
# and live in the instance file.

[services.cctp_bridge]
# `fast_burn_allowance` (Iris, USDC) and `scan_chunk_blocks` (the watcher's
# endpoint contract) are deployment values: they live in the CCTP instance
# file, not here. Circle publishes a rolling allowance, so there is no safe
# generic number to fall back to.
# One watcher pass per second on each chain: new MessageSent logs + due
# attestations.
poll_interval_ms = 1000
# The JSON-RPC request budget and the boot wait for each chain.
rpc_timeout_secs = 30
boot_timeout_secs = 300
# The emulated PENDING window: the attestation is served this many
# seconds after the burn (0 = immediately).
finality_delay_secs = 0
# The served `expirationBlock`: 0 = the message never expires; short values
# exercise the "must be re-signed" path.
expiration_blocks = 0
# `scan_chunk_blocks` is the watcher's endpoint contract and lives in the
# CCTP instance file. The client further splits any chunk above the endpoint
# group's `max_log_range` (the public HyperEVM source pins 900).
# How long a submitted tx may wait for a receipt inside one tick.
receipt_timeout_secs = 30
# Receipt poll cadence while a submitted tx is pending.
receipt_poll_ms = 500
# Node-side send refusals before a message is parked.
max_send_attempts = 5
# Bridge status log cadence (the store's counts).
status_log_interval_ms = 60000
# Who drives relays: `auto` (the relayer's tick) or `manual` (only
# `POST /control/relay` — deterministic expiry/reattest tests).
relayer = "auto"
# Gas alerts, the deployment defaults: warn below 0.1 ETH, error below 0.01 ETH.
balance_low_wei = "100000000000000000"
balance_critical_wei = "10000000000000000"

[services.cctp_bridge.iris]
addr = "0.0.0.0"

[services.cctp_bridge.control]
addr = "0.0.0.0"
