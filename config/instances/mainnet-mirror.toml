# The Mainnet Mirror instance (plan §19): deployment facts only.
#
# Values that every deployment of a service shares live in config/defaults.toml
# (layered below this file); `${VAR}` references are resolved from the pod's
# environment at load time (deploy-time wiring, §19.4).

[instance]
name = "mainnet-mirror"
namespace = "mainnet-mirror"
profile = "ethereum"

[chains.l1]
# The chain id is a code fact (`kind = "ethereum"` implies chain 1, CCTP
# domain 0, canonical USDC); only the deployment's source is data.
kind = "ethereum"
source_url = "${RETH_URL}"
# Follow `latest` (the CL head): the parent stream then advances one block
# per ~12 s, so T mines one block per ~12 s and devnet transactions confirm
# in ~12 s (measured with `safe`: the safe tag jumps 32 blocks per epoch, so
# the applier burst-mines every ~6.4 min and a devnet tx waits minutes - a
# fork that does not confirm is not a fork). The rare shallow reorg is
# handled by the continuity check + the M re-base path
# (metrics: mirror_reorgs_detected_total).
follow = "latest"
# Blocks between the follow head and M's fork base when the engine has to
# re-base M: the safe head can move backward (CL forkchoice), and M's replay
# is irreversible, so the mirror re-forks behind it instead of stalling.
# Constraints: well inside reth's 10,064-block state window; inside the
# range of slots whose blobs the local Lighthouse supernode can reconstruct;
# and *behind* the follow head (with the offset at 64 the pin sat exactly at
# the follow head and a safe-head recede of a few blocks left M ahead of it,
# stalling the replay until the safe head caught up - measured). 128 keeps
# ~64 blocks of margin. This is the single home of the offset: the anvil
# init containers read it via `mirror-config get chains.l1.fork_offset`.
fork_offset = 128

[services.engine]
state_dir = "${STATE_DIR}"

[services.engine.anvil]
m_url = "${ANVIL_M_URL}"
t_url = "${ANVIL_T_URL}"

[services.engine.source_sync]
# reth's authenticated Engine API endpoint + the JWT secret shared with the
# consensus client (a path, never the secret itself).
engine_url = "${ENGINE_API_URL}"
jwt_path = "${JWT_PATH}"

[services.engine.verifier]
# State probes re-run against M after every repair: convergence_failures
# staying at 0 is the "M is an exact mirror" health signal.
probes = [
  { name = "usdc_total_supply", to = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", data = "0x18160ddd" },
  { name = "weth_total_supply", to = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", data = "0x18160ddd" },
  { name = "chainlink_weth_usd", to = "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419", data = "0xfeaf968c" },
  { name = "univ3_weth_usdc_slot0", to = "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640", data = "0x3850c7bd" },
  # scaledTotalSupply, not totalSupply: the aToken's totalSupply is
  # `scaled * liquidityIndex`, and the devnet's own reserve actions
  # re-price the index at a different second than mainnet's last update -
  # a dust drift (measured 7.8e-13 aUSDC) that an exact probe cannot tell
  # from a real divergence. The scaled value is index-independent and
  # still catches any real supply/withdraw divergence.
  { name = "aave_aethusdc_scaled_total_supply", to = "0x98C23E9d8f34FEFb1B7BD6a91B7FF122F4e16F5c", data = "0xb1bf962d" },
  # The oracle's price proves the interaction closure: it only matches
  # reth when the oracle *and* its source contracts are watched.
  { name = "aave_usdc_price", to = "0x54586bE62E3c3580375aE3723C145253060Ca0C2", data = "0xb3596f07000000000000000000000000A0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" },
  # WETH's source is a proxy whose aggregator was missing from the watch
  # list; its price froze while USDC's stayed live. One WETH price probe
  # makes that class of gap an alarm instead of a silent staleness.
  { name = "aave_weth_price", to = "0x54586bE62E3c3580375aE3723C145253060Ca0C2", data = "0xb3596f07000000000000000000000000C02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2" },
  # The full price closure: the composite WBTC source and the other
  # reserves get the same probe the WETH source has, so a missing
  # aggregator behind a *composite* source is an alarm, not a silent
  # staleness (measured: the WBTC price sat stale while all probes stayed
  # green, 2026-10).
  { name = "aave_wbtc_price", to = "0x54586bE62E3c3580375aE3723C145253060Ca0C2", data = "0xb3596f070000000000000000000000002260FAC5E5542a773Aa44fBCfeDf7C193bc2C599" },
  { name = "aave_usdt_price", to = "0x54586bE62E3c3580375aE3723C145253060Ca0C2", data = "0xb3596f07000000000000000000000000dAC17F958D2ee523a2206206994597C13D831ec7" },
  { name = "aave_wsteth_price", to = "0x54586bE62E3c3580375aE3723C145253060Ca0C2", data = "0xb3596f070000000000000000000000007f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0" },
  { name = "aave_usdc_normalized_income", to = "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2", data = "0xd15e0053000000000000000000000000A0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" },
]

[services.engine.journal]
dir = "${STATE_DIR}/journal"

[services.engine.blobs]
# Sidecar sources, tried in order. Self-contained: the only source is our
# own Lighthouse, which runs as a PeerDAS semi-supernode (half the data
# columns = enough to reconstruct every blob) for the 18-day availability
# window. A regular (non-supernode) node CANNOT reconstruct blobs after
# EIP-7594 - it answers HTTP 400 "Insufficient data columns to reconstruct
# blobs" (measured). Every candidate is KZG-validated (c-kzg + bundled
# mainnet trusted setup) per blob tx before it is sent; Fulu placeholder
# proofs (0xc0..) are recomputed locally, so a source that cannot
# reconstruct blobs can never poison the pool.
beacon_urls = ["${BEACON_URL}"]

[services.engine.http]
port = 8080

# Watch list seed (plan section 3.5). All slots of a watched account are
