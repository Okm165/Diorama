# Project specialization — gitignored.
#
# This file is the deployment's ONLY config source beyond the shared
# defaults: every value below is hardcoded here (endpoints — keyed ones
# included —, fork facts, state roots), and no `${VAR}` reference may appear
# — the file is mounted into the pods as a file, and env indirection would
# make it specific to one cluster's wiring. `specialization.example.toml` is
# the tracked, complete template; copy it to `specialization.toml` for a
# deployment and replace every value.

# Endpoint capability claims are verified endpoint-by-endpoint at boot (the
# capability audit, `crates/devnet/src/source.rs::audit_capabilities`); the
# wire facts behind them are measured with `scripts/probe-endpoint.sh`, which
# is also the re-probe for provider drift - a claim lives exactly as long as
# the provider's behavior does.

[endpoints.anvil]
# The devnet chain the engine drives (V).
http = ["http://anvil-v:8545"]
chain_id = 999

# The HyperEVM read pool — one nested declaration per endpoint, each carrying
# the capabilities it is *measured* to serve (`scripts/probe-endpoint.sh` is
# the acceptance test; run it 3× before claiming `historical`, the keyless
# pools are load balancers whose composition moves). The pool admits by
# capability, round-robins, cools failures down and fails over; `max_log_range`
# and `weight` ride the entry, the group-level values are the fallback.
# ENV override for the whole flat list remains `DIORAMA__ENDPOINTS__*`.
[endpoints.evm]
chain_id = 999
# The public HyperEVM source pool's measured free-plan cap: wider eth_getLogs
# ranges stall or are refused. The client splits scans at this bound.
max_log_range = 900

[[endpoints.evm.entries]]
url = "https://rpc.hyperliquid.xyz/evm"
capabilities = ["system_txs", "batch"]

[[endpoints.evm.entries]]
url = "https://rpc.hypurrscan.io"
capabilities = ["system_txs", "batch"]

[[endpoints.evm.entries]]
url = "https://hyperliquid-json-rpc.stakely.io"
capabilities = ["system_txs", "batch"]

[[endpoints.evm.entries]]
url = "https://hyperliquid-rpc.publicnode.com"
capabilities = ["system_txs", "batch"]

[[endpoints.evm.entries]]
url = "https://hyperliquid.rpc.blxrbdn.com"
capabilities = ["system_txs", "batch"]

[[endpoints.evm.entries]]
url = "https://hyperliquid.api.pocket.network"
capabilities = ["system_txs", "batch"]

[endpoints.hyperliquid_info]
# The market REST plane. A keyed mirror (e.g. ZAN) slots in as the first
# entry with `capabilities = ["market_rest"]`; the official API stays as
# failover. The keyed URL is hardcoded here — the specialization is
# gitignored, so the key never enters git or a cluster Secret.
http = [
  "https://api.zan.top/node/v1/hyperliquid/mainnet/<YOUR_ZAN_KEY>",
  "https://api.hyperliquid.xyz",
]
roles = ["market_rest"]

[endpoints.hyperliquid_ws]
ws = ["wss://api.hyperliquid.xyz/ws"]
roles = ["market_ws"]

[endpoints.engine_admin]
# The venue engine's admin API (in-namespace service DNS).
http = ["http://engine:8080"]
# The x-* spot plane's on-chain oracle control is this same admin surface:
# `POST /admin/feed {"feed": "<agg>", "mode": "set"|"crash"|"rally", "answer"|"pct"}`
# writes a `MirrorPriceFeed` (silent `anvil_setStorageAt`, fresh timestamp,
# strictly increasing round, journaled).
#
# **A venue-sim mirror's x-* prints must stay inside the indexer's two
# ingestion bounds, and a print is seeded once at deploy unless a scenario
# moves it.** The indexer refuses a round that (a) diverges >1500 bps from the
# sim venue's own `oraclePx` or (b) moves >2000 bps in a single round; on a
# refusal it keeps the previous served price and warns. Measured 2026-11-21:
# the seeded prints sat 4–12 % above the sim's oracle across the whole x-* set
# (xSOXL 29 % — refused, held at the deploy print, so the asset was
# unpricable), while the sim walked. Two consequences for an operator:
#   * align a drifted print with `set` **in steps** ≤ 19 % per round, waiting
#     for an ingest cycle between steps (a single 29 % correction is itself
#     refused by bound (b));
#   * align to the venue **oracle**, not the mark: the guard compares the
#     printed answer with `oraclePx`.
# A long-running sim wants the prints re-synced on the venue tick; until that
# exists, the drift is visible as `oracle_ingestion_guards` warns on the
# indexer's `/health`.

# The explicit fork base. A configured pin preserves the deployment epoch
# across restarts; omit it (or comment the line out) to resolve a fresh pin
# at start-up — that is what a **fresh** deployment does (a new machine has no
# persisted state to preserve, and a pin a state file does not agree with
# trips the engine's epoch-rollback guard, fail-closed).
# The live deployment pins its base in its own specialization.toml and pairs
# it with an archive-deep fork source below — the official endpoint serves
# `latest` only.
[chains.venue]
# fork_pin = 51273700
# The fork source anvil V forks from: archive-deep, usually keyed. The
# official endpoint is the keyless default; a keyed archive (e.g. ZAN's
# .../node/v1/hyperliquid/mainnet/<KEY>/evm) is the pinned deployment's
# choice. It is deliberately NOT a member of the `@evm` read pool (measured:
# the keyed planes refuse batched calls).
fork_url = "https://rpc.hyperliquid.xyz/evm"


