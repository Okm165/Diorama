# Project specialization — gitignored.
#
# The generic `instance.toml` carries deployment facts (identity,
# profile, state paths, ports). This file carries the product's
# endpoint groups, watch scope, fixture ownership, probes and
# closures. `specialization.example.toml` is the tracked, complete template;
# copy it to `specialization.toml` for a deployment.

[endpoints.anvil_v]
http = ["${ANVIL_V_URL}"]
chain_id = 999

[endpoints.hyperevm]
http = ["${HL_RPC_URLS}"]
chain_id = 999
# The public HyperEVM source's measured free-plan cap: wider eth_getLogs
# ranges stall or are refused. The client splits scans at this bound.
max_log_range = 900

[endpoints.hyperliquid_api]
http = ["${HL_INFO_API_URL}"]
roles = ["market_rest"]

[endpoints.hyperliquid_ws]
ws = ["${HL_WS_API_URL}"]
roles = ["market_ws"]

[endpoints.engine_admin]
http = ["${ENGINE_ADMIN_URL}"]

# The explicit fork base. A configured pin preserves the deployment epoch
# across restarts; omit it to resolve a fresh pin at start-up.
[chains.venue]
fork_pin = 50748852


[services.engine]
fixture_addresses = ["0xb88339CB7199b77E23DB6E890353E22632Ba630f", "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599", "0x6B175474E89094C44Da98b954EedeAC495271d0F", "0x5555555555555555555555555555555555555555", "0x94e8396e0869c9F2200760aF0621aFd240E1CF38"]

[services.engine.verifier]
probes = [
  { name = "usdc_total_supply", to = "0xb88339CB7199b77E23DB6E890353E22632Ba630f", data = "0x18160ddd" },
  # Non-devnet-owned CCTP contracts: these give the venue mirror a real at-pin
  # parity signal even while the USDC probe is skipped (devnet-owned).
  { name = "cctp_message_transmitter_domain", to = "0x81D40F21F12A8F0E3252Bccb954D722d4c464B64", data = "0x8d3638f4" },
  { name = "cctp_token_minter_messenger", to = "0xfd78EE919681417d192449715b2594ab58f5D002", data = "0x770fc1f0" },
]

