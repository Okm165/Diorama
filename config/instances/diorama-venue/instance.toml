# The Venue Mirror instance: deployment facts only.
#
# One file = one deployment. Every key here differs between deployments;
# everything else is `config/defaults.toml` (ports, the journal ring and its
# location, the endpoint policy, the engine's cadence). Product scope
# (endpoint groups, markets, fixtures, probes, closures) lives in
# `specialization.toml`, gitignored; `specialization.example.toml` is the
# tracked template. Endpoint references use `@name` and are expanded from
# `[endpoints]` before validation.
[instance]
name = "diorama-venue"
namespace = "diorama-venue"
profile = "venue"
project = "specialization"

[chains.venue]
kind = "hyperliquid"
# The EVM read pool (random healthy start, fail over, cool a failed endpoint
# down). The market plane's REST and WS pools ride the same policy.
source_urls = "@evm"
api_urls = "@hyperliquid_info"
ws_urls = "@hyperliquid_ws"
# An explicit fork base, when the deployment pins one, lives in the
# specialization's `[chains.venue]` as `fork_pin`.

[services.engine]
# The boot wait for V: this is the *anvil's* budget, not the engine's. A
# fork-mode anvil loads its state dump and materializes source state on
# demand, and a rate-limited archive source has been measured past 5 minutes
# (2026-11-17: 120 s here exited the engine while V was still forking, 35
# restarts in 42 h). 1200 s is the same 20-minute budget as the anvil's
# startupProbe (240 x 5 s in k8s/base/diorama-venue/anvil-v.yaml); keep the
# two equal.
boot_timeout_secs = 1200

# The follow's cadence and window against the public source. The window is
# the catch-up width: a 100-block window advances slower than the source's
# ~60 blocks/min, so a 35k-block gap never closes. 900 blocks per pass is the
# live catch-up width that closed the measured 35k gap; the composer halves
# an `eth_getLogs` chunk on a response-size refusal, so the wider window still
# respects the endpoint's request budget.
[services.engine.loops]
poll_interval_ms = 2000
max_gap_blocks = 900
# The deployment's endpoint contract (the public pool's batch size).
chunk_size = 500

[services.venue_sim]
engine_admin_url = "@engine_admin"
anvil_url = "@anvil"
