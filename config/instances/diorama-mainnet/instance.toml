# The Mainnet Mirror instance: deployment facts only.
#
# One file = one deployment. Every key here differs between deployments;
# everything else is `config/defaults.toml` (the workspace conventions every
# mirror shares: ports, the journal ring and its location, the endpoint
# policy, the engine's cadence). Product scope (endpoint groups, watchlist,
# fixtures, probes, feeds) lives in `specialization.toml`, gitignored;
# `specialization.example.toml` is the tracked template. Endpoint references
# use `@name` and are expanded from `[endpoints]` before validation.
[instance]
name = "diorama-mainnet"
namespace = "diorama-mainnet"
profile = "mainnet"
project = "specialization"

[chains.l1]
kind = "ethereum"
# The read pool: the first entry is the anvil fork source and the
# `/admin/epoch` re-pin target; the engine fans out over the whole group.
source_urls = "@evm"
follow = "latest"
# Blocks between the follow head and T's fork base; the single home of the
# offset (the anvil pods read it from this file). An explicit fork base, when
# the deployment pins one, lives in the specialization's `[chains.l1]` as
# `fork_pin`.
fork_offset = 128

[services.engine.loops]
# Chain-1 catch-up: the live gap is ~3.3k blocks; 10k stays below the
# 10,064-block rebase bound and leaves margin for source advance.
max_gap_blocks = 10000
# JSON-RPC batch items for source reads and local cheatcode writes: the
# deployment's endpoint contract (the local reth), not a global default.
chunk_size = 500

# The top-up loop (EIP-8379): reth's engine API. The JWT file's path is a
# deployment fact and lives in the specialization's
# [services.engine.source_sync].
[services.engine.source_sync]
engine_url = "@engine_api"

# The local consensus client is the beacon source.
[services.engine.beacon]
urls = ["@beacon"]
