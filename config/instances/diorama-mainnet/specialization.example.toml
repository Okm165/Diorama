# Project specialization — gitignored.
#
# The generic `instance.toml` carries one deployment's identity, profile and
# chain/cadence deltas. This file carries the deployment's endpoint groups,
# state root, watch scope, fixture ownership, probes and closures. Ports and
# the journal ring are the shared defaults. `specialization.example.toml` is
# the tracked, complete template; copy it to `specialization.toml` for a
# deployment.

# The chain-1 EVM plane (http only; any EVM node — local reth here).
# Local only by policy: no latency, no public-RPC dependency.
#
# The claims are the node's measured facts, not its brand: reth serves the
# native BAL rung (EIP-7928), the `debug_*` trace rung, state at historical
# blocks (its 10,064-block window) and batch bodies; it serves NO WebSocket
# listener (re-measured 2026-11-17: /proc/net/tcp in the reth pod shows
# listeners on 8545 and 8551 only, an upgrade on 8545 is refused with 403,
# and 8546 is closed — so no `heads_ws` and no `ws` list). They are what
# the boot audit probes per endpoint and what capability-gated admission
# routes on — an unqualified endpoint would be admitted to every call but
# credited with nothing.
[endpoints.evm]
chain_id = 1
# Measured 2026-11-17 on the live reth: eth_getBlockAccessList (bal),
# debug_traceBlockByNumber with prestateTracer/diffMode (traces), state reads
# inside its 10,064-block window (historical; reth.toml account/storage
# distance=10064) and batch bodies all answered.
http = ["http://reth:8545"]

[endpoints.anvil]
http = ["http://anvil-t:8545"]
chain_id = 1

[endpoints.engine_api]
http = ["http://reth:8551"]

[endpoints.beacon]
http = ["http://lighthouse:5052"]

# The explicit fork base. A configured pin preserves the deployment epoch
# across restarts; omit it to resolve a fresh pin at start-up. The pin must stay
# inside reth's state window (`reth.toml` account/storage history, 10,064
# blocks): an older pin makes every unwritten read fail with "pruned history
# unavailable", which freezes chain 1 while the block head still advances.
# `make mainnet-repin` resolves a fresh pin and starts a new epoch.
[chains.l1]
# Pinned 2026-11-17 for the chain-1 mirror bootstrap (register §8.27 rule b):
# a changed fork pin is a new epoch, and a re-resolved pin above the deploy
# block loses the epoch's contracts. This pin (reth head 26437497 at
# resolution minus the 128-block offset) is at/below the deploy block and
# inside reth's 10,064-block state window, so the epoch's contracts survive
# every restart while the pin stands. A future deliberate re-pin edits this
# line first.
#
# Measured 2026-11-17 (not inherited): `anvil_nodeInfo` on the live anvil-t
# reports forkConfig.forkBlockNumber=26437369, /state/pin holds 26437369, and
# the engine's cursor.json says epoch_pin=26437369 — all three agree. reth
# head was 26437688 at measurement (319 blocks above the pin, inside the
# window).
fork_pin = 26437369

[services.engine]
# The deployment's state root: the engine pod's own PVC mount path.
state_dir = "/state"
fixture_addresses = ["0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599", "0x6B175474E89094C44Da98b954EedeAC495271d0F", "0x98C23E9d8f34FEFb1B7BD6a91B7FF122F4e16F5c", "0x4d5F47FA6A74757f35C14fD3a6Ef8E3C9BC514E8", "0x23878914EFE38d27C4D67Ab83ed1b93A74D4086a", "0x5Ee5bf7ae06D1Be5997A1A72006FE6C607eC6DE8", "0x0B925eD163218f6662a35e0f0371Ac234f9E9371", "0x4575acc57E1FFA7CcccD5969898d1114c0792216", "0x5c4075FCC531b2227dd1E6Aef747BeEe3a0A7067", "0x6359978c0dF49aBf6A163E3F526c29b2602645fb", "0x8EdCC3340e082033D78F9C1ef177CA5c10963bcB", "0xCd171B437d9329C2654128645944fbC05C9AA2BF", "0x797945E6995c60933E635623A5dD7F3822DD2AF5", "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419", "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c", "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8", "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6", "0x3E7d1EAB13ad0104d2750B8863b489D65364e32D"]

# The parent chain's live Chainlink answers → T's mock aggregators.
# In mirror mode the bridge is the single price writer (the mocks' own
# refresher is off). 5s keeps a source round inside the client's freshness
# budget without waiting a full minute; the confirmation window is the
# outcome-unknown reconciliation bound. The source `AnswerUpdated`
# subscription is the event-lane target; this poll remains its reconciliation
# net.
#
# The bridge writes to the **canonical aggregator addresses** on T, where the
# mirror is supposed to install a mock (the `updateAnswer` surface). Those
# addresses are also the guard's proof-oracle feeds (`config/oracles`), so one
# write would keep the indexer's served price and the close/enforcement
# witness on the same round.
#
# Re-measured 2026-11-17 (live T, eth_getCode at `latest`): only the WETH and
# WBTC targets hold the mock (3974-byte code, fixture-owned — their writes
# mine); the STETH, USDC and USDT targets still hold the chain-1 aggregator
# proxy code (9572 bytes, byte-identical to reth) and every write to them
# mines as a revert (the live engine logs "the write mined as a revert" /
# "did not mine within 10000 ms"). And the live indexer (`daloc` namespace,
# CHAIN_1_CHAINLINK_FEEDS in its mounted chain-registry.env) reads the
# *fixture CREATE* feeds, not these addresses: ETH 0x19f33b95…, BTC
# 0x63f3A211…, STETH 0xD701E6F4…, USDC 0x1b488abd…, USDT 0x6c03CB02…,
# WSTETH 0x7c8E4c87… — all six are code-bearing on T (4340-byte mock) and
# come from today's DeployTestFixtures run. So the design below ("the mirror
# installs a mock at the canonical address") is only half true this epoch:
# the consumer deploy must either etch the mocks at these canonical addresses
# (the stable design this list encodes — the target then survives a fresh
# fork) or the target must become the fixture address (which changes on every
# deploy). That is a deploy-side choice, not a config literal to guess here.
#
# The old non-guard fixture proxies (`0x4575…`, `0x5c40…`, …) are no longer a
# read topology, but they are still listed in `fixture_addresses` as
# whole-account ownership markers (measured 2026-11-17: codeless on T and on
# the chain-1 source — nothing deploys or reads them today; harmless there,
# and can be dropped when the deploy stops mentioning them).
[services.engine.feed_bridge]
poll_interval_ms = 5000
confirm_window_ms = 120000
# A dedicated writer, never the deploy account: the bridge and the deployer
# share a chain and an anvil pool, and a shared nonce sequence races them
# (measured 2026-11-19: the deployer's stuck feed tx displaced the first
# initialize). The section's own contract demands this; the template now does.
writer = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
feeds = [
  # wstETH is **not** proxied to stETH. The mirror deploys the composed
  # wstETH/USD feed at the registry address, which multiplies the mirrored
  # STETH/USD answer by the on-chain `stEthPerToken()` rate. Writing the stETH
  # answer into a 1:1 wstETH mock misprices every wstETH book while the rate is
  # not exactly 1.0; the composed feed is the only correct source.
  { name = "WETH/USD (guard)", source = "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419", target = "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419" },
  { name = "WBTC/USD (guard)", source = "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c", target = "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c" },
  { name = "STETH/USD (guard)", source = "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8", target = "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8" },
  { name = "USDC/USD (guard)", source = "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6", target = "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6" },
  { name = "USDT/USD (guard)", source = "0x3E7d1EAB13ad0104d2750B8863b489D65364e32D", target = "0x3E7d1EAB13ad0104d2750B8863b489D65364e32D" },
]

[services.engine.verifier]
probes = [
  { name = "usdc_total_supply", to = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", data = "0x18160ddd" },
  { name = "weth_total_supply", to = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", data = "0x18160ddd" },
