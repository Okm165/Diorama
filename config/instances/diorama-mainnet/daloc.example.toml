# DALOC project specialization — gitignored.
#
# The generic `instance.toml` carries deployment facts (identity,
# profile, state paths, ports). This file carries the product's
# endpoint groups, watch scope, fixture ownership, probes and
# closures. `daloc.example.toml` is the tracked, complete template;
# copy it to `daloc.toml` for a deployment.

[endpoints.reth]
http = ["${RETH_URL}"]
chain_id = 1

[endpoints.anvil_t]
http = ["${ANVIL_T_URL}"]
chain_id = 1

[endpoints.reth_engine]
http = ["${ENGINE_API_URL}"]

[endpoints.lighthouse]
http = ["${BEACON_URL}"]

[services.engine]
fixture_addresses = ["0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599", "0x6B175474E89094C44Da98b954EedeAC495271d0F", "0x98C23E9d8f34FEFb1B7BD6a91B7FF122F4e16F5c", "0x4d5F47FA6A74757f35C14fD3a6Ef8E3C9BC514E8", "0x23878914EFE38d27C4D67Ab83ed1b93A74D4086a", "0x5Ee5bf7ae06D1Be5997A1A72006FE6C607eC6DE8", "0x0B925eD163218f6662a35e0f0371Ac234f9E9371", "0x4575acc57E1FFA7CcccD5969898d1114c0792216", "0x5c4075FCC531b2227dd1E6Aef747BeEe3a0A7067", "0x6359978c0dF49aBf6A163E3F526c29b2602645fb", "0x8EdCC3340e082033D78F9C1ef177CA5c10963bcB", "0xCd171B437d9329C2654128645944fbC05C9AA2BF", "0x797945E6995c60933E635623A5dD7F3822DD2AF5"]

# The parent chain's live Chainlink answers → T's mock aggregators.
# In mirror mode the bridge is the single price writer (the mocks' own
# refresher is off). 5s keeps a source round inside the client's freshness
# budget without waiting a full minute; the confirmation window is the
# outcome-unknown reconciliation bound. The source `AnswerUpdated`
# subscription is the event-lane target; this poll remains its reconciliation
# net.
#
# The targets are the devnet fixture mocks (the `updateAnswer` surface), not
# the read-only real aggregator code that the mirror also carries at
# `0x7d4e…`/`0x4a34…`/`0x26f1…`/`0x54bc…`/`0x9c41…`. The mocks are listed in
# `fixture_addresses` so the parent-diff apply never clobbers the bridge's
# writes.
[services.engine.feed_bridge]
poll_interval_ms = 5000
confirm_window_ms = 120000
writer = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
feeds = [
  { name = "WETH/USD", source = "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419", target = "0x4575acc57E1FFA7CcccD5969898d1114c0792216" },
  { name = "WBTC/USD", source = "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c", target = "0x5c4075FCC531b2227dd1E6Aef747BeEe3a0A7067" },
  { name = "STETH/USD", source = "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8", target = "0x8EdCC3340e082033D78F9C1ef177CA5c10963bcB" },
  # wstETH is **not** proxied to stETH. The mirror deploys the composed
  # wstETH/USD feed at the registry address (`0xC3D8...`), which multiplies the
  # mirrored STETH/USD answer by the on-chain `stEthPerToken()` rate. Writing
  # the stETH answer into a 1:1 wstETH mock misprices every wstETH book while
  # the rate is not exactly 1.0; the composed feed is the only correct source.
  { name = "USDC/USD", source = "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6", target = "0xCd171B437d9329C2654128645944fbC05C9AA2BF" },
  { name = "USDT/USD", source = "0x3E7d1eAB13ad0104d2750B8863b489D65364e32D", target = "0x797945E6995c60933E635623A5dD7F3822DD2AF5" },
  # The **proof oracle** is the guard's feed (`config/oracles`), not the writable
  # price target above. On the mirror the guard feed is the canonical aggregator
  # address; the mirror installs a mock at that address and the bridge writes the
  # parent chain's live answer into it, so the close/enforcement witness reads a
  # feed inside its own heartbeat instead of a static mainnet round. The source
  # is read from reth, the target from T (same address, different chains).
  { name = "WETH/USD (guard)", source = "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419", target = "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419" },
  { name = "WBTC/USD (guard)", source = "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c", target = "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c" },
  { name = "STETH/USD (guard)", source = "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8", target = "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8" },
  { name = "USDC/USD (guard)", source = "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6", target = "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6" },
  { name = "USDT/USD (guard)", source = "0x3E7d1EAB13ad0104d2750B8863b489D65364e32D", target = "0x3E7d1EAB13ad0104d2750B8863b489D65364e32D" },
]

