# The instance files published as ConfigMaps (plan §19.5): one file per
# instance, mounted into every pod of that instance - one file, many readers.
# One generator per instance whose pods mount the file; an overlay that
# includes this directory carries every generated instance ConfigMap and
# mounts only its own.
#
# The generator lives in this directory because kustomize reads generator files
# only from below its kustomization root, and the instance files' home is this
# directory. Overlays include this kustomization as a resource; the generated
# name's hash suffix rolls the instance's pods when an instance file changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: venue-instance
    files:
      - instance.toml=venue-mirror.toml
