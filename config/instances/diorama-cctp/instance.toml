# The generic CCTP bridge instance: deployment facts only.
#
# The bridge is its own process/profile, never a section of a mirror
# instance. One instance = one bridge; several bridges (or several venues and
# mainnets) compose as independent instances sharing the same spine.
#
# The topology is data: the project specialization (gitignored `daloc.toml`,
# template `daloc.example.toml`) carries `[[services.cctp_bridge.chains]]`
# (each chain's CCTP domain and contracts) and `[[services.cctp_bridge.lanes]]`
# (the directed burns). Add a chain or a lane there, not in code. The legacy
# `t_url`/`v_url` pair remains accepted as a two-chain shorthand.
[instance]
name = "diorama-cctp"
# The bridge is a first-class instance: its own namespace, ConfigMap, Secret
# and PVC. It reaches the mirror chains cross-namespace; it never rides the
# venue's namespace or wiring.
namespace = "diorama-cctp"
profile = "cctp"
project = "daloc"

[services.cctp_bridge]
state_dir = "${CCTP_STATE_DIR}"
relay_key = "${CCTP_RELAY_KEY}"
attester_seed = "diorama-cctp-devnet-attester"

[services.cctp_bridge.iris]
addr = "0.0.0.0"
port = 8095

[services.cctp_bridge.control]
addr = "0.0.0.0"
port = 8096
