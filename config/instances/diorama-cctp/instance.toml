# The CCTP bridge instance: deployment facts only.
#
# The bridge is its own process/profile, never a section of a mirror
# instance. One instance = one bridge; several bridges (or several venues and
# mainnets) compose as independent instances sharing the same spine.
#
# The topology is data: the project specialization (gitignored
# `specialization.toml`, template `specialization.example.toml`) carries
# `[[services.cctp_bridge.chains]]` (each chain's CCTP domain and contracts)
# and `[[services.cctp_bridge.lanes]]` (the directed burns). Everything the
# bridge shares with the mirrors (the API ports, the poll/receipt cadence, the
# gas alerts) is `config/defaults.toml`.
[instance]
name = "diorama-cctp"
# The bridge is a first-class instance: its own namespace, ConfigMap, Secret
# and PVC. It reaches the mirror chains cross-namespace; it never rides the
# venue's namespace or wiring.
namespace = "diorama-cctp"
profile = "cctp"
project = "specialization"

[services.cctp_bridge]
state_dir = "${CCTP_STATE_DIR}"
# A Secret, never a ConfigMap key: `make secrets` writes it from
# `secrets.env` into the instance's Secret.
relay_key = "${CCTP_RELAY_KEY}"
attester_seed = "diorama-cctp-devnet-attester"
# Circle's live fast-burn allowance is a rolling figure (measured 2026-10-31:
# 56,854,459.08 USDC). This deployment pins the measured value; there is no
# safe generic fallback.
fast_burn_allowance = 56854459.08
# The watcher scans the mirror anvils, whose per-call range is 2,000 blocks.
# The client still clamps any chunk to the endpoint group's `max_log_range`,
# so a public source cannot receive a wider range.
scan_chunk_blocks = 2000
