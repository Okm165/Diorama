# DALOC project specialization for the CCTP bridge — gitignored.
#
# The generic `instance.toml` carries the bridge's deployment facts; this file
# carries the endpoint groups. `daloc.example.toml` is the tracked template.

[endpoints.t_rpc]
http = ["${T_RPC_URL}"]
chain_id = 1

[endpoints.anvil_v]
http = ["${ANVIL_V_URL}"]
chain_id = 999

[[services.cctp_bridge.chains]]
id = "ethereum"
family = "ethereum"
chain_id = 1
domain = 0
rpc_urls = "@t_rpc"
usdc = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
token_messenger = "0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d"
message_transmitter = "0x81D40F21F12A8F0E3252Bccb954D722d4c464B64"
token_minter = "0xfd78EE919681417d192449715b2594ab58f5D002"

[[services.cctp_bridge.chains]]
id = "hyperevm"
family = "hyperliquid"
chain_id = 999
domain = 19
rpc_urls = "@anvil_v"
usdc = "0xb88339CB7199b77E23DB6E890353E22632Ba630f"
token_messenger = "0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d"
message_transmitter = "0x81D40F21F12A8F0E3252Bccb954D722d4c464B64"
token_minter = "0xfd78EE919681417d192449715b2594ab58f5D002"

[[services.cctp_bridge.lanes]]
