# The mirrors workspace: one workspace, two projects (ethereum, hyperliquid),
# the shared crates, and the CCTP bridge (refactor plan §11).
[workspace]
members = ["crates/*", "bins/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Plan pins: alloy 2.5.0 (EIP-7928 BAL types live in alloy-eips::eip7928).
alloy-primitives = { version = "1.7", features = ["serde"] }
# "kzg" gives c-kzg (bundled mainnet trusted setup) so the engine can
# verify blob sidecars before sending them: a bad sidecar (e.g. a non-supernode
# beacon source serving stale data) is skipped and the next source is tried.
alloy-consensus = { version = "2.5", features = ["serde", "kzg"] }
alloy-network-primitives = { version = "2.5", features = ["serde"] }
# "k256" enables EIP-7702 authorization-signature recovery: the nonce tracker
# recovers each authorization's authority so a sender that is bumped mid-block
# is classified as expected instead of logging a (false) nonce-gap warning.
alloy-eips = { version = "2.5", features = ["serde", "k256"] }
alloy-rpc-types-eth = { version = "2.5", features = ["serde"] }
# Engine API client: replays the local CL's execution payloads into reth, so
# the mirror never needs P2P peers or a public RPC to fill a sync gap.
alloy-rpc-types-engine = { version = "2.5", features = ["jwt", "serde"] }
# The official JSON-RPC 2.0 wire model (request/response/error/id/batch) both
# clients share - the envelope is a protocol, not our vocabulary.
alloy-json-rpc = { version = "2.5" }
# The official chain-id newtype (`alloy_chains::ChainId`): a chain id is a
# namespace of its own, never a bare u64 and never a CCTP domain
# (`mirror-cctp::chains::Domain`).
alloy-chains = { version = "0.2" }
# Quantity (0x-hex) and other wire serde helpers.
alloy-serde = { version = "2.5" }
# ABI encode/decode for the few plain contracts the mirror calls directly
# (the feed bridge's Chainlink aggregators; the CCTP bridge's messages).
alloy-sol-types = { version = "1.7" }
# The Beacon REST API wire model (blob sidecars, signed blocks, headers).
# "ssz" enables the official beacon→engine execution-request conversion
# (`ExecutionRequestsV4::to_requests`), used by the top-up loop.
alloy-rpc-types-beacon = { version = "2.5", features = ["ssz"] }
# The debug_* trace wire model (geth tracer options, prestateTracer frames).
alloy-rpc-types-trace = { version = "2.5" }
# The anvil control-plane wire model (nodeInfo, reset/forking params).
alloy-rpc-types-anvil = { version = "2.5" }
# The txpool namespace wire model (status/content/inspect).
alloy-rpc-types-txpool = { version = "2.5" }

axum = "0.8"
clap = { version = "4", features = ["derive"] }
# Stream/Sink adapters for the venue websocket client.
futures-util = "0.3"
# alloy-rpc-types-engine's `jwt` feature pulls jsonwebtoken but selects no
# crypto provider, so signing panics at runtime ("Could not automatically
# determine the process-level CryptoProvider"). alloy has no rust-crypto
# variant, so enable it here; feature unification applies it graph-wide.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Venue money is decimal text on the wire (prices/sizes/margins); f64 is not
# a money type. rust_decimal keeps every served identity exact.
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Config is TOML (§19): crates/config, the layered loader.
toml = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
# The venue's websocket lane (market plane: allMids + activeAssetCtx pushes).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.clippy]
# The anti-patterns the design doctrine names (§11.0); CI runs -D warnings.
needless_pass_by_value = "warn"
unused_self = "warn"
unnecessary_wraps = "warn"
single_match = "warn"
single_match_else = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
similar_names = "warn"
too_many_lines = "warn"
unreadable_literal = "warn"
redundant_closure_for_method_calls = "warn"

[profile.release]
lto = "thin"
strip = true
