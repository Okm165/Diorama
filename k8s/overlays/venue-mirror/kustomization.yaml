# The Venue Mirror instance overlay: the venue base + the instance ConfigMap +
# the harness NodePorts. The mainnet-mirror overlay is untouched: the two
# mirrors share the cluster and the mirror-retain StorageClass, not a
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: venue-mirror

resources:
  - namespace.yaml
  - ../../base/venue-mirror
  # The instance ConfigMap generator (config/instances/kustomization.yaml):
  # every pod of this instance mounts /etc/mirror/instance.toml from it.
  - ../../../config/instances
  - nodeports.yaml
