# The Venue Mirror instance overlay: the venue base + the instance ConfigMap +
# the harness NodePorts. The mainnet-mirror overlay is untouched: the two
# mirrors share the cluster and the mirror-retain StorageClass, not a
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: venue-mirror

resources:
  - namespace.yaml
  - ../../base/venue-mirror
  # The cross-mirror bridge: its own base (it belongs to neither mirror); it
  # deploys beside the venue stack and reaches T cross-namespace.
  - ../../base/cctp-bridge
  # This instance's unit (config/instances/venue-mirror): the file every pod
  # of this instance mounts at /etc/mirror/instance.toml, and its generator.
  - ../../../config/instances/venue-mirror
  - nodeports.yaml
