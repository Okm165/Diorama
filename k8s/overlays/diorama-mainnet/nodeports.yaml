# Host access for the consumer harness. The harness runs on the test host,
# outside the cluster, so the mirror's RPC/WS/admin must be reachable there.
#
# These are **ClusterIP** twins, not NodePorts: a NodePort binds every host
# interface and exposes the Anvil cheatcode set (`anvil_setBalance`,
# `anvil_setCode`, `eth_sendTransaction` from unlocked accounts) to the LAN.
# The host reaches these services through a loopback-only port-forward:
#
#   kubectl -n diorama-mainnet port-forward --address 127.0.0.1 \
#     svc/anvil-t 30545:8545
#   kubectl -n diorama-mainnet port-forward --address 127.0.0.1 \
#     svc/engine 30880:8080
#
# The env below keeps the loopback ports, so the harness is unchanged.
---
apiVersion: v1
kind: Service
metadata:
  name: anvil-t-nodeport
  labels: { app.kubernetes.io/name: anvil-t, app.kubernetes.io/part-of: diorama-mainnet }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: anvil-t }
  ports:
    # the consumer's CHAIN_1_RPC_URL / CHAIN_1_WS_URL point here; anvil
    # serves WebSocket upgrades on the same port.
    - { name: http, port: 8545, targetPort: 8545 }
---
apiVersion: v1
kind: Service
metadata:
  name: engine-nodeport
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: diorama-mainnet }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: engine }
  ports:
    # /status, /metrics, /admin/* (deal, shadow, epoch, time, rewind) - the
    # harness's reset/deal levers. Loopback port-forward only; never a NodePort.
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-endpoints
  labels:
    app.kubernetes.io/part-of: diorama-mainnet
data:
  # The values the consumer harness sources (their external-mode env).
  # The single-node k3s node *is* the test host; a remote harness overrides
  # the host and keeps the ports. This is the *first* chain's block; the
  # venue's (the second chain) lives in overlays/diorama-venue/nodeports.yaml
  # with the `CHAIN_1_` prefix — source both for the complete env.
  test-endpoints.env: |
    CHAIN_1_CHAIN_ID=1
    CHAIN_1_RPC_URL=http://localhost:30545
    CHAIN_1_WS_URL=ws://localhost:30545
    DIORAMA_ADMIN_URL=http://localhost:30880
