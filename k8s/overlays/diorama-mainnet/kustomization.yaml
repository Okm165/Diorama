# The Mainnet Mirror instance overlay: the mirror base + the instance
# ConfigMap + the harness services. The diorama-venue overlay is untouched:
# the two mirrors share the cluster and the wire-named StorageClass, not a
# namespace.
#
# The two mirror overlays are structurally identical (namespace, inventory,
# harness services, the class literal): a change to one is a change to both,
# or it is a bug in whichever came first.
#
# No wiring ConfigMap: the configuration is the specialization file, mounted
# into every pod at /etc/mirror/specialization.toml by the instance unit
# below. There are no config envs and no config Secrets on the k8s side — the
# specialization is the only per-deployment source of truth.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diorama-mainnet

# The host harness surface: the loopback forwards the operator chooses
# (`harness.env`, the gitignored copy of the tracked `harness.example.env`;
# `make port-forward` opens them). The chain ids and in-cluster service DNS
# are derived by `diorama-config export-env --section client`, never
# repeated here. No pod reads this map - only the host harness - so it
# carries no roll-triggering hash.
configMapGenerator:
  - name: test-endpoints
    envs: [harness.env]
    options:
      disableNameSuffixHash: true

resources:
  - namespace.yaml
  - ../../base/diorama-mainnet
  # This instance's unit (config/instances/diorama-mainnet): the files every
  # pod of this instance mounts at /etc/mirror (instance.toml and the
  # gitignored specialization.toml), and their generator. The generator FAILS
  # the build when the specialization is absent - the no-silent-gap behavior.
  - ../../../config/instances/diorama-mainnet

# The cluster facts every claim and every repo image derives from: the one
# storage-class substitution point and the one registry point (components/
# storage, components/registry). Both are shared by all three instances.
components:
  - ../../components/storage
  - ../../components/registry
