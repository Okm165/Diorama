# The Mainnet Mirror instance overlay: the mirror base + the instance
# ConfigMap + the wiring ConfigMap + the harness services. The diorama-venue
# overlay is untouched: the two mirrors share the cluster and the
# wire-named StorageClass, not a namespace.
#
# The two mirror overlays are structurally identical (namespace, wiring,
# inventory, harness services, the class replacement): a change to one is a
# change to both, or it is a bug in whichever came first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diorama-mainnet

# The deployment wiring (reth, the beacon, the engine API): generated from
# `wiring.env`, the gitignored copy of `wiring.example.env`.
configMapGenerator:
  - name: diorama-config
    envs: [wiring.env]
  # The host harness surface: the loopback forwards the operator chooses
  # (`harness.env`, the gitignored copy of the tracked `harness.example.env`;
  # `make port-forward` opens them). The chain ids and in-cluster service DNS
  # are derived by `diorama-config export-env --section client`, never
  # repeated here. No pod reads this map - only the host harness - so it
  # carries no roll-triggering hash.
  - name: test-endpoints
    envs: [harness.env]
    options:
      disableNameSuffixHash: true

resources:
  - namespace.yaml
  - ../../base/diorama-mainnet
  # This instance's unit (config/instances/diorama-mainnet): the file every pod
  # of this instance mounts at /etc/mirror/instance.toml, and its generator.
  - ../../../config/instances/diorama-mainnet

# One fact, one spelling: the StorageClass's name and every claim's class are
# the wiring's `STORAGE_CLASS` (see storage-class.yaml).
replacements:
  - path: storage-class.yaml
