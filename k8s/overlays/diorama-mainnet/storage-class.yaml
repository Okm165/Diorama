# The claim class the manifests create and request: one fact, one spelling.
# The source is the instance wiring's `STORAGE_CLASS` (wiring.env, through the
# generated ConfigMap); the class's own manifest carries the default literal
# k8s/base/shared/storageclass.yaml, which every base includes.
- source:
    kind: ConfigMap
    name: diorama-config
    fieldPath: data.STORAGE_CLASS
  targets:
    - select:
        kind: StorageClass
      fieldPaths:
        - metadata.name
    - select:
        kind: PersistentVolumeClaim
      fieldPaths:
        - spec.storageClassName
