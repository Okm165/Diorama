# The bridge's external harness surface. Kept beside the bridge overlay, not
# the venue's: a venue without a bridge publishes no Iris/control port.
---
apiVersion: v1
kind: Service
metadata:
  name: cctp-bridge-nodeport
  labels: { app.kubernetes.io/name: cctp-bridge, app.kubernetes.io/part-of: diorama-cctp }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: cctp-bridge }
  ports:
    # 8095 is the Iris-compatible base daloc's cctp-relay points at; 8096 the
    # control API.
    - { name: iris, port: 8095, targetPort: 8095, nodePort: 31095 }
    - { name: control, port: 8096, targetPort: 8096, nodePort: 31096 }
