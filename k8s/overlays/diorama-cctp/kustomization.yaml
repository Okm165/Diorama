# The CCTP bridge instance overlay: its own base and namespace.
#
# It is deliberately not part of the venue overlay: a venue can run without a
# bridge, a bridge can run without the venue, and a deployment may run several
# bridges. Each bridge gets its own namespace, ConfigMap, PVC and harness
# services; the shared spine is the code, not the Kubernetes objects.
#
# No wiring ConfigMap: the configuration is the specialization file, mounted
# into the pod at /etc/mirror/specialization.toml by the instance unit below.
# There are no config envs and no config Secrets on the k8s side.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diorama-cctp

# The host harness surface (`harness.env`): the loopback forward the operator
# chooses (`make port-forward` opens it). The Iris base
# (`cctp-bridge.diorama-cctp.svc:8095`) is derived by
# `diorama-config export-env --section client`; no pod reads that map - only
# the host harness - so it carries no roll-triggering hash.
configMapGenerator:
  - name: cctp-test-endpoints
    envs: [harness.env]
    options:
      disableNameSuffixHash: true

resources:
  - namespace.yaml
  - ../../base/diorama-cctp
  - ../../../config/instances/diorama-cctp

# The cluster facts every claim and every repo image derives from: the one
# storage-class substitution point and the one registry point (components/
# storage, components/registry). Both are shared by all three instances.
components:
  - ../../components/storage
  - ../../components/registry
