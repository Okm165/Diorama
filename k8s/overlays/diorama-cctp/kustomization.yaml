# The CCTP bridge instance overlay: its own base, namespace and wiring.
#
# It is deliberately not part of the venue overlay: a venue can run without a
# bridge, a bridge can run without the venue, and a deployment may run several
# bridges. Each bridge gets its own namespace, ConfigMap, Secret, PVC and
# NodePorts; the shared spine is the code, not the Kubernetes objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diorama-cctp

resources:
  - namespace.yaml
  - wiring.yaml
  - ../../base/cctp-bridge
  - ../../../config/instances/diorama-cctp
  - nodeports.yaml
