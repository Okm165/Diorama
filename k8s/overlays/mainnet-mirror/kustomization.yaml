# The Mainnet Mirror instance overlay: the mirror base + the instance
# ConfigMap + the harness NodePorts. The venue-mirror overlay is untouched:
# the two mirrors share the cluster and the mirror-retain StorageClass, not a
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mainnet-mirror

resources:
  - namespace.yaml
  - ../../base/mainnet-mirror
  # This instance's unit (config/instances/mainnet-mirror): the file every pod
  # of this instance mounts at /etc/mirror/instance.toml, and its generator.
  - ../../../config/instances/mainnet-mirror
  - nodeports.yaml
