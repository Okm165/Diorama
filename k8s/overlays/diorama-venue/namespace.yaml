# The Venue Mirror namespace: a sibling of diorama-mainnet in the same cluster
# - its own storage, services and ClusterIPs (the host reaches them through
# loopback forwards, never NodePorts), the shared mirror-retain StorageClass.
apiVersion: v1
kind: Namespace
metadata:
  name: diorama-venue
  labels:
    app.kubernetes.io/part-of: diorama-venue
    app.kubernetes.io/name: diorama-venue
