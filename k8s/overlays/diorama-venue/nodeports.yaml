# Host access for the consumer harness: the venue mirror's services, reachable
# from the test host. These are **ClusterIP** twins, not NodePorts: a NodePort
# binds every host interface and exposes the Anvil cheatcode set and the
# venue's /admin/* controls to the LAN. The host uses loopback-only forwards:
#
#   kubectl -n diorama-venue port-forward --address 127.0.0.1 \
#     svc/anvil-v 31545:8545
#   kubectl -n diorama-venue port-forward --address 127.0.0.1 \
#     svc/engine 31880:8080
#   kubectl -n diorama-venue port-forward --address 127.0.0.1 \
#     svc/venue-sim 31090:8090 31091:8091
#
# The env below keeps the loopback ports, so the harness is unchanged.
---
apiVersion: v1
kind: Service
metadata:
  name: anvil-v-nodeport
  labels: { app.kubernetes.io/name: anvil-v, app.kubernetes.io/part-of: diorama-venue }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: anvil-v }
  ports:
    # the consumer's CHAIN_999_RPC_URL / CHAIN_999_WS_URL point here; anvil
    # serves WebSocket upgrades on the same port.
    - { name: http, port: 8545, targetPort: 8545 }
---
apiVersion: v1
kind: Service
metadata:
  name: engine-nodeport
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: diorama-venue }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: engine }
  ports:
    # /status, /metrics, /admin/* (deal, shadow, epoch, pause, resume).
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: venue-sim-nodeport
  labels: { app.kubernetes.io/name: venue-sim, app.kubernetes.io/part-of: diorama-venue }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: venue-sim }
  ports:
    # 8090 is the info API the consumer reads (HL_INFO_API_URL); 8091 the control
    # API the harness drives. Loopback port-forward only.
    - { name: info, port: 8090, targetPort: 8090 }
    - { name: control, port: 8091, targetPort: 8091 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-endpoints
  labels:
    app.kubernetes.io/part-of: diorama-venue
data:
  # The values the consumer harness sources (their external-mode env).
  # The single-node k3s node *is* the test host; a remote harness overrides
  # the host and keeps the ports.
  #
  # The venue is chain 999: its keys use the canonical `CHAIN_999_*` family,
  # so sourcing this block beside the mainnet's `CHAIN_1_*` block
  # (k8s/overlays/diorama-mainnet/nodeports.yaml) yields one collision-free
  # env with the chain ids the services assert.
  test-endpoints.env: |
    CHAIN_999_CHAIN_ID=999
    CHAIN_999_RPC_URL=http://localhost:31545
    CHAIN_999_WS_URL=ws://localhost:31545
    HL_INFO_API_URL=http://localhost:31090
    VENUE_CONTROL_URL=http://localhost:31091
    VENUE_ADMIN_URL=http://localhost:31880
    # IRIS_API_URL belongs to the CCTP overlay (diorama-cctp): a venue can
    # run without a bridge, so it must not advertise a dead endpoint.
