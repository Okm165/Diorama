# The Venue Mirror instance overlay: the venue base + the instance ConfigMap +
# the harness NodePorts. The diorama-mainnet overlay is untouched: the two
# mirrors share the cluster and the diorama-retain StorageClass, not a
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diorama-venue

resources:
  - namespace.yaml
  - ../../base/diorama-venue
  # This instance's unit (config/instances/diorama-venue): the file every pod
  # of this instance mounts at /etc/mirror/instance.toml, and its generator.
  - ../../../config/instances/diorama-venue
  - nodeports.yaml
  # The CCTP bridge is its own instance/overlay
  # (k8s/overlays/diorama-cctp), so a venue can run without a bridge and a
  # bridge can run without this venue.
