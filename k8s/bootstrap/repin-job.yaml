# Bootstrap Job: wipe the anvil pin to force a re-pin.
#
# Used by `make mainnet-repin`. After this Job:
#   1. delete it,
#   2. restart anvil-t (its init container resolves a fresh pin),
#   3. the engine detects the chain reset on its next poll and runs the epoch
#      rule (a fresh pin clears the registry; the devnet re-creates its state).
#
# The fork RPC cache (~/.foundry/cache/rpc/<chain>/<block>/) is keyed by block
# number and is left in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: repin-wipe
  namespace: mainnet-mirror
  labels:
    app.kubernetes.io/name: repin-wipe
    app.kubernetes.io/part-of: mainnet-mirror
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: repin-wipe
        app.kubernetes.io/part-of: mainnet-mirror
    spec:
      restartPolicy: Never
      containers:
        - name: wipe
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for d in /state/anvil-t; do
                echo "wiping $d: pin (+ legacy dump)"
                rm -f "$d/pin" "$d/state.json"
                ls -la "$d" || true
              done
          volumeMounts:
            - { name: anvil-t-state, mountPath: /state/anvil-t }
      volumes:
        - { name: anvil-t-state, persistentVolumeClaim: { claimName: anvil-t-state } }
