# Bootstrap Job: download the official reth modular snapshot into the reth PVC.
#
#   Profile: --minimal = state + headers + last 50k blocks of txs/receipts +
#   recent changesets. Measured 165 GB compressed / ~287 GB on disk (2026-10).
#   This is the leanest snapshot that still gives the mirror: head state,
#   the 10,064-block state window, live block bodies and receipts.
#
#   Resumable by default (.part + Range), so a killed pod just continues.
#   Run `make snapshot` (which scales reth down first - the downloader refuses
#   to run while the node holds the database lock).
apiVersion: batch/v1
kind: Job
metadata:
  name: reth-snapshot
  namespace: mainnet-mirror
  labels:
    app.kubernetes.io/name: reth-snapshot
    app.kubernetes.io/part-of: mainnet-mirror
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 172800
  # Keep the completed pod for an hour (log inspection), then clean up.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reth-snapshot
        app.kubernetes.io/part-of: mainnet-mirror
    spec:
      restartPolicy: OnFailure
      containers:
        - name: download
          image: ghcr.io/paradigmxyz/reth:v2.8.0@sha256:796c866410171459946d6607301ad728a1b150ea0aa05623cf6bdf79cd3e3322
          args:
            - download
            - --chain=mainnet
            # Explicit component selection instead of the --minimal preset, so
            # the snapshot matches the runtime prune profile (receipts/bodies
            # 20k, account/storage history 10,064) and no surplus is downloaded
            # only to be pruned on first start. The state itself (~266 GB) is
            # the bulk and cannot be trimmed.
            #
            # RocksDB stays: it holds the EIP-7928 BAL store that the engine's
            # diff applier and convergence repair read via
            # eth_getBlockAccessList. `--without-rocksdb` would break them.
            - --with-txs-distance=20000
            - --with-receipts-distance=20000
            - --with-state-history-distance=10064
            - --with-senders
            - --with-rocksdb
            - --non-interactive
            - --resumable
            - --download-concurrency=16
            - --datadir=/data
            - --color=never
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { memory: 4Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: reth-data }
