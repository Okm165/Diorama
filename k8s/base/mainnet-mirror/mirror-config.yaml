# Shared runtime wiring for the Mainnet Mirror stack: the L1 wiring env the
# instance TOML references as ${...} (plan §19.4). Operational tunables live
# in config/instances/*.toml; this ConfigMap carries only deployment wiring,
# and the config loader is their only reader.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mirror-config
  labels:
    app.kubernetes.io/part-of: mainnet-mirror
data:
  # Local fork source (reth). Never point this at a remote endpoint in
  # production mode: remote mining is 55-256 s/block (measured).
  RETH_URL: "http://reth:8545"

  # The two chain endpoints the engine drives, plus the beacon/engine-api/JWT
  # wiring for blobs and the top-up loop (EIP-8379). The fork offset's single
  # home is [chains.l1].fork_offset in the instance file - the anvil pods read
  # it from the mounted TOML, so it is not repeated here.
  ANVIL_M_URL: "http://anvil-m:8545"
  ANVIL_T_URL: "http://anvil-t:8545"
  BEACON_URL: "http://lighthouse:5052"
  ENGINE_API_URL: "http://reth:8551"
  JWT_PATH: "/secrets/jwt.hex"
  STATE_DIR: "/state"

  # Lighthouse checkpoint sync (fresh CL head without genesis sync).
  CHECKPOINT_SYNC_URL: "https://mainnet-checkpoint-sync.stakely.io"
  CHECKPOINT_SYNC_FALLBACK: "https://sync-mainnet.beaconcha.in"

  # Public mainnet RPC, used only by the self-test Job (a test-only external
  # dependency: it forks scratch Anvils from a public RPC and needs no reth).
  # Nothing in the runtime stack uses it - the engine always talks to the local
  # reth, and smoke.sh checks source liveness against the local CL.
  MAINNET_RPC: "https://ethereum-rpc.publicnode.com"
