# engine - the Mainnet Mirror engine: the L1 replay loop (M), the verifier, the
# BAL diff applier (T), and the admin surface (/admin/epoch, /admin/shadow,
# /admin/feed, /admin/time, /admin/rewind).
#
# Same shape as the venue engine deployment: the image carries the mainnet
# binary, the mounted instance file selects the profile (plan §19.5), and the
# state (cursor, journal, shadow registry, drift log) lives on the engine-state
# PVC so restarts resume where they left.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/part-of: mainnet-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
        app.kubernetes.io/part-of: mainnet-mirror
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: localhost/mainnet-engine:v1
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/mirror/instance.toml"]
          # The wiring the instance TOML references as ${...} (RETH_URL,
          # ANVIL_*_URL, BEACON_URL, ENGINE_API_URL, JWT_PATH, STATE_DIR).
          envFrom:
            - configMapRef: { name: mirror-config }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
            - { name: state, mountPath: /state }
            # Shared with reth + lighthouse: the engine calls reth's authrpc
            # (Engine API) to run the top-up loop that keeps reth at the CL head
            # without any P2P peers.
            - { name: jwt, mountPath: /secrets, readOnly: true }
          # `/livez`, not `/healthz`: the engine's healthz reports its own
          # state (503 while paused), and probing it would drop the pod (and
          # its NodePort) out of rotation — and eventually restart it — in the
          # middle of a documented pause drill, while the contract says a
          # paused engine keeps serving reads and writes.
          readinessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: instance
          configMap: { name: mainnet-instance }
        - name: state
          persistentVolumeClaim: { claimName: engine-state }
        - name: jwt
          secret: { secretName: reth-jwt }
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: mainnet-mirror }
spec:
  selector: { app.kubernetes.io/name: engine }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
