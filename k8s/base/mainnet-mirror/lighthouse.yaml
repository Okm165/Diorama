# Lighthouse - consensus layer driver for reth (checkpoint-synced, no validator).
#
# Lean profile: no validator client, no light-client server, no QUIC/UPnP,
# 40 target peers, blob/column pruning at the data-availability boundary,
# execution payloads retained (needed by the engine's top-up loop).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lighthouse
  labels:
    app.kubernetes.io/name: lighthouse
    app.kubernetes.io/part-of: mainnet-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lighthouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lighthouse
        app.kubernetes.io/part-of: mainnet-mirror
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: lighthouse
          image: docker.io/sigp/lighthouse:v8.3.0@sha256:ca59d3a3f3016d3e1aa0bbf9ed331f4f24b113b4ab72c493a8216a0fd57aec27
          command: ["lighthouse"]
          args:
            - bn
            - --network=mainnet
            - --datadir=/data
            - --execution-endpoint=http://reth:8551
            - --execution-jwt=/secrets/jwt.hex
            # Fresh head without a genesis sync. Only used on the first start;
            # restarts reuse the datadir.
            - --checkpoint-sync-url=$(CHECKPOINT_SYNC_URL)
            - --checkpoint-sync-url-timeout=120
            # Ops/debug API (sync status, beacon headers) - read-only.
            - --http
            - --http-address=0.0.0.0
            - --http-port=5052
            - --metrics
            - --metrics-address=0.0.0.0
            - --metrics-port=5054
            # P2P: single TCP+UDP port, no QUIC, no UPnP (hostPort below).
            - --port=9000
            - --discovery-port=9000
            - --disable-quic
            - --disable-upnp
            - --disable-light-client-server
            - --target-peers=40
            # After PeerDAS (EIP-7594) a regular beacon node cannot serve full
            # blob sidecars (HTTP 400 "Insufficient data columns ... run with
            # --supernode or --semi-supernode"). The mirror is self-contained:
            # Lighthouse custodies half the data columns (enough to reconstruct
            # every blob) for the data-availability window (18 days), which is
            # far more than the mirror needs (reth's state window is 10,064
            # blocks ~ 1.4 days). Costs ~100 GB of columns at steady state.
            #
            # Backfill is bounded by design and deliberately left at its
            # defaults (Lighthouse book, "Backfilling Blocks"):
            #   - depth stops at the weak-subjectivity point (~5 months), not
            #     genesis, unless --genesis-backfill is passed (we never do);
            #   - rate-limited to "typically less than 20 slots/s" - measured
            #     ~10-15 slots/s here, enough to cover the snapshot->head gap
            #     (8.4k slots, ~10 min) while the top-up loop waits;
            #   - columns/blobs are pruned at the data-availability boundary
            #     (--prune-blobs default true). Setting --prune-blobs=false
            #     together with --semi-supernode means *nothing* is ever pruned
            #     (book, advanced_blobs.md) - unbounded disk for no benefit;
            #   - --complete-blob-backfill only fetches columns *beyond* the DA
            #     window (experimental, "may block most of its peers") - not
            #     needed, so not set.
            - --semi-supernode
            # Blob/column storage is bounded to the 18-day DA window, but the
            # *pruner* runs every --epochs-per-blob-prune epochs (default 256 ~
            # 27 h). During the one-time backfill the node downloads blobs for
            # every backfilled slot, and with a 27 h prune interval the peak can
            # exceed the PVC before the first prune (measured: blobs_db growing
            # ~20 GB/h). Prune every epoch instead; only data older than the DA
            # boundary is touched, which the mirror never needs.
            - --prune-blobs=true
            - --epochs-per-blob-prune=1
            - --blob-prune-margin-epochs=0
            # Keep execution payloads in the beacon DB. Default (true) prunes
            # them and rebuilds from the execution client on demand - impossible
            # for blocks the EL has not executed yet, which is exactly the gap
            # the engine's top-up loop fills. See docs/ARCHITECTURE.md.
            - --prune-payloads=false
            - --log-format=JSON
            # File logging defaults to 10 x 200 MB on the same PVC (measured:
            # 815 MB of info logs after a few hours of backfill). 2 x 50 MB is
            # plenty - the container's stdout carries the same stream.
            - --logfile-max-number=2
            - --logfile-max-size=50
          envFrom:
            - configMapRef: { name: mirror-config }
          ports:
            - { name: http, containerPort: 5052 }
            - { name: metrics, containerPort: 5054 }
            - { name: p2p-tcp, containerPort: 9000, protocol: TCP, hostPort: 9000 }
            - { name: p2p-udp, containerPort: 9000, protocol: UDP, hostPort: 9000 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: jwt, mountPath: /secrets, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 5052 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5052 }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            # No CPU limit (attestation and backfill work is latency-sensitive
            # and bursty); the memory request tracks the measured steady state
            # (~8 GiB) so the scheduler reserves it. 6Gi OOM-looped during the
            # initial sync (measured); the limit keeps a ~1.5x margin over the
            # steady state for the prune/backfill peaks.
            requests: { cpu: "1", memory: 8Gi }
            limits: { memory: 12Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: lighthouse-data }
        - name: jwt
          secret: { secretName: reth-jwt }
---
apiVersion: v1
kind: Service
metadata:
  name: lighthouse
  labels: { app.kubernetes.io/name: lighthouse, app.kubernetes.io/part-of: mainnet-mirror }
spec:
  selector: { app.kubernetes.io/name: lighthouse }
  ports:
    - { name: http, port: 5052, targetPort: 5052 }
    - { name: metrics, port: 5054, targetPort: 5054 }
