# Lighthouse - consensus layer driver for reth (checkpoint-synced, no validator).
#
# Lean profile: no validator client, no light-client server, no QUIC/UPnP,
# 40 target peers, payload/blob pruning left at their (enabled) defaults.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lighthouse
  labels:
    app.kubernetes.io/name: lighthouse
    app.kubernetes.io/part-of: mainnet-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lighthouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lighthouse
        app.kubernetes.io/part-of: mainnet-mirror
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: lighthouse
          image: docker.io/sigp/lighthouse:v8.3.0
          command: ["lighthouse"]
          args:
            - bn
            - --network=mainnet
            - --datadir=/data
            - --execution-endpoint=http://reth:8551
            - --execution-jwt=/secrets/jwt.hex
            # Fresh head without a genesis sync. Only used on the first start;
            # restarts reuse the datadir.
            - --checkpoint-sync-url=$(CHECKPOINT_SYNC_URL)
            - --checkpoint-sync-url-timeout=120
            # Ops/debug API (sync status, beacon headers) - read-only.
            - --http
            - --http-address=0.0.0.0
            - --http-port=5052
            - --metrics
            - --metrics-address=0.0.0.0
            - --metrics-port=5054
            # P2P: single TCP+UDP port, no QUIC, no UPnP (hostPort below).
            - --port=9000
            - --discovery-port=9000
            - --disable-quic
            - --disable-upnp
            - --disable-light-client-server
            - --target-peers=40
            # NOTE: after PeerDAS (EIP-7594, live on bpo2) a regular beacon node
            # cannot serve full blob sidecars: /eth/v1/beacon/blob_sidecars
            # returns 400 "Insufficient data columns ... run with --supernode or
            # --semi-supernode". The mirror therefore takes sidecars from a
            # public beacon API (engine config `blobs.beacon_urls`); add
            # --semi-supernode here if you want a local source (more disk/CPU).
            - --log-format=JSON
            - --logfile-max-number=2
          envFrom:
            - configMapRef: { name: mirror-config }
          ports:
            - { name: http, containerPort: 5052 }
            - { name: metrics, containerPort: 5054 }
            - { name: p2p-tcp, containerPort: 9000, protocol: TCP, hostPort: 9000 }
            - { name: p2p-udp, containerPort: 9000, protocol: UDP, hostPort: 9000 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: jwt, mountPath: /secrets, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 5052 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5052 }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: "1", memory: 2Gi }
            # Checkpoint sync + backfill caches are memory hungry; 6Gi
            # OOM-looped during the initial sync (measured), 16Gi is stable.
            limits: { memory: 16Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: lighthouse-data }
        - name: jwt
          secret: { secretName: reth-jwt }
---
apiVersion: v1
kind: Service
metadata:
  name: lighthouse
  labels: { app.kubernetes.io/name: lighthouse, app.kubernetes.io/part-of: mainnet-mirror }
spec:
  selector: { app.kubernetes.io/name: lighthouse }
  ports:
    - { name: http, port: 5052, targetPort: 5052 }
    - { name: metrics, port: 5054, targetPort: 5054 }
