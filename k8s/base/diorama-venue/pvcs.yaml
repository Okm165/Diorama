# Persistent volumes for the Venue Mirror. Same diorama-retain StorageClass
# (Retain) as the mainnet mirror's pvcs.yaml - one file per mirror's claims,
# because a kustomize overlay composes whole files and the venue overlay must
# not declare the mainnet claims (reth-data is 400Gi, lighthouse-data 1500Gi).
#
# LOCAL (workshop): every claim here is disposable. Deleting a PVC+PV and
# re-applying provisions a fresh volume through the same mirror-retain
# StorageClass; see the mainnet pvcs.yaml for the retained claims.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anvil-v-state
  labels: { app.kubernetes.io/part-of: diorama-venue, app: anvil-v }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mirror-retain
  resources:
    requests:
      # V forks the source on demand and carries only the devnet's own writes
      # (T's measured working set is ~2.5 GB); 20Gi is comfortable, the plan's
      # range is 10-40Gi.
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: venue-sim-state
  labels: { app.kubernetes.io/part-of: diorama-venue, app: venue-sim }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mirror-retain
  resources:
    requests:
      # sim.json + feed.json: small JSON state, 5Gi is plenty.
      storage: 5Gi
---
# Shared by profiles: PVCs are namespaced, so the venue instance
# carries its own claim of the same name/shape as the mainnet mirror's.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: engine-state
  labels: { app.kubernetes.io/part-of: diorama-venue, app: engine }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mirror-retain
  resources:
    requests:
      storage: 10Gi
