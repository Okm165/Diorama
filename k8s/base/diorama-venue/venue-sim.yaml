# venue-sim - the simulator: the live market plane (REST snapshots + WS pushes
# from the venue's public API) and the COW account plane, served as the
# client-facing info API (8090, the `hl_mock`-compatible surface) beside the
# control API (8091: deal/advance/crash/set_account/reset/epoch_new).
#
# State (sim.json + feed.json) lives on the venue-sim-state PVC: a restart
# resumes the scenario, and the simulator's epoch is its own (/control/reset
# blanks the account plane; /control/epoch_new also re-pins V through the
# engine's /admin/epoch).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-sim
  labels:
    app.kubernetes.io/name: venue-sim
    app.kubernetes.io/part-of: diorama-venue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: venue-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: venue-sim
        app.kubernetes.io/part-of: diorama-venue
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: venue-sim
          image: localhost/diorama-venue-sim:relay-320026d
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/mirror/instance.toml"]
          # No env: the configuration is the mounted specialization file
          # (/etc/mirror/specialization.toml beside the instance file). The
          # keyed market-REST mirror lives in the specialization's
          # [endpoints.hyperliquid_info] - gitignored, so the key never
          # enters a cluster Secret.
          ports:
            - { name: info, containerPort: 8090 }
            - { name: control, containerPort: 8091 }
          volumeMounts:
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
            - { name: state, mountPath: /state }
          # /readyz is the market-plane freshness gate (meta present + every
          # configured market fresher than the staleness window); it answers
          # 503 while warming up, which is exactly the readiness signal.
          # The boot-wait may outlast a dependency's own restart: a
          # startupProbe (the server's own liveness path) suspends the
          # liveness/readiness probes through it, so a coordinated rollout
          # never kills a booting container (measured: exit 137 at ~2 minutes
          # when a dependency restarted under a rolling engine). Readiness
          # stays the market-plane freshness gate.
          # timeoutSeconds must exceed a busy scrape: the default 1 s made a healthy
          # pod report `context deadline exceeded` under load (measured 2026-11-21).
          startupProbe:
            httpGet: { path: /healthz, port: 8090 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            # No CPU limit. Measured 2026-10-31 (60 s sample): ~4m CPU,
            # 23-24 MiB RSS. The request tracks the measured steady state; the
            # limit stays the OOM ceiling for a market-plane catch-up spike.
            requests: { cpu: "5m", memory: 32Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: instance
          configMap: { name: venue-instance }
        - name: state
          persistentVolumeClaim: { claimName: venue-sim-state }
---
apiVersion: v1
kind: Service
metadata:
  name: venue-sim
  labels: { app.kubernetes.io/name: venue-sim, app.kubernetes.io/part-of: diorama-venue }
spec:
  selector: { app.kubernetes.io/name: venue-sim }
  ports:
    - { name: info, port: 8090, targetPort: 8090 }
    - { name: control, port: 8091, targetPort: 8091 }
---
# The public order path. A stable NodePort (31090 — the port the harness docs
# already name) so the Funnel ingress and any host-side proxy point at the
# node, not at a kubectl forward that dies with its session (measured
# 2026-11-20: the venue funnel's upstream forward lost its pod and 502'd the
# public /info and /exchange surface).
#
# ── Apply this file through the instance overlay only ─────────────────────────
# The Deployment above names the configMapGenerator's template (`venue-instance`);
# the live Deployment mounts the overlay's hash-suffixed render. A raw
# `kubectl apply -f` of this base rewrites the volume to a name that does not
# exist and the simulator loses its mount (measured: FailedMount
# `configmap "venue-instance" not found`). Services are safe standalone; the
# Deployment is not: `make up INSTANCE=diorama-venue` (the overlay) or a
# service-only extraction.
apiVersion: v1
kind: Service
metadata:
  name: venue-sim-nodeport
  labels: { app.kubernetes.io/name: venue-sim, app.kubernetes.io/part-of: diorama-venue }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: venue-sim }
  ports:
    - { name: info, port: 8090, targetPort: 8090, nodePort: 31090 }
