# anvil-v - the Venue Mirror's devnet chain (V, chain-id 999).
#
# A fork-mode anvil over the public HyperEVM RPC. There is no follow machinery
# and no fork offset (unlike T): the source is archive-deep (measured: >=5M
# blocks), so the pin is simply the source's latest block. The engine's epoch
# rule keys on this pin (persisted in /state/pin): a re-pin to a *different*
# base is a new epoch (the shadow registry is cleared, the simulator re-pins
# explicitly through /admin/epoch), the same base restores the recorded writes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-v
  labels:
    app.kubernetes.io/name: anvil-v
    app.kubernetes.io/part-of: diorama-venue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil-v
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-v
        app.kubernetes.io/part-of: diorama-venue
    spec:
      # Give anvil time to shut down cleanly on SIGTERM.
      terminationGracePeriodSeconds: 90
      initContainers:
        # Resolve a *fresh* pin on every start, like T: the source serves
        # `latest` at archive depth, so a restart re-forks at a current block
        # and the driver reconciles it as an epoch on its next pass.
        - name: resolve-pin
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # The fork source is the archive plane; the engine's read pool
              # (`HL_RPC_URLS`) deliberately excludes it because it does not
              # answer `eth_getSystemTxsByBlockNumber`.
              : "${HL_RPC_URL:?HL_RPC_URL is required}"
              # An explicit pin preserves the epoch across a source change. A
              # re-pin to the source's current head is a *new base*: the driver
              # clears the shadow registry (measured 2026-11-01, a restart moved
              # 50,042,205 -> 50,086,498 and cleared 1,974 slots / 109 accounts).
              # A deployment that must keep its writes pins the block here.
              if [ -n "${ANVIL_FORK_PIN:-}" ]; then
                PIN="$ANVIL_FORK_PIN"
                echo "$PIN" > /state/pin
                echo "using explicit fork pin=$PIN (source head not re-resolved)"
                chmod 0777 /state 2>/dev/null || true
                chmod 0666 /state/pin 2>/dev/null || true
                exit 0
              fi
              # Wait for the fork source first: anvil forks at start-up, so a
              # restart while the source is unreachable would crash-loop.
              i=0; HEAD=""
              while [ -z "$HEAD" ] && [ "$i" -lt 240 ]; do
                HEAD=$(wget -qO- --header='Content-Type: application/json' \
                  --post-data='{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                  "$HL_RPC_URL" 2>/dev/null \
                  | sed -n 's/.*"result":"\(0x[0-9a-fA-F]*\)".*/\1/p')
                [ -n "$HEAD" ] || { i=$((i+1)); sleep 5; }
              done
              [ -n "$HEAD" ] || { echo "ERROR: fork source unreachable at $HL_RPC_URL"; exit 1; }
              PIN=$((HEAD))
              echo "$PIN" > /state/pin
              # The container runs unprivileged and re-resolves the pin on every
              # *container* start (k8s restarts only the container on OOM), so it
              # must be able to rewrite this file (measured on T: without the
              # chmod the write failed and the persisted pin silently aged).
              chmod 0777 /state 2>/dev/null || true
              chmod 0666 /state/pin 2>/dev/null || true
              echo "resolved pin=$PIN (source head=$HEAD)"
          env:
            - name: HL_RPC_URL
              valueFrom: { configMapKeyRef: { name: diorama-config, key: HL_RPC_URL } }
            # Explicit epoch pin. This is the live chain-999 epoch base; it
            # preserves the venue shadow registry across restarts. Changing it
            # is an explicit re-pin: update both containers and the live
            # deployment, snapshot state, and accept the epoch transition.
            - { name: ANVIL_FORK_PIN, value: "50748852" }
          volumeMounts:
            - { name: state, mountPath: /state }
          # The init is a short `wget`/shell loop. Without an explicit request, a
          # limit (live: 24Gi) defaults the request to the same value and is the
          # node-overcommit driver. Keep it tiny and bounded.
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:v1.8.6@sha256:4a16a86f41d30418fbdca47ce2868121bbb0aeaa0a34bde2dd1e2911c4be2464
          # The image entrypoint is `/bin/sh -c` and swallows bare args; use a
          # shell wrapper and `exec` so SIGTERM reaches anvil (clean shutdown).
          command: ["/bin/sh", "-c"]
          args:
            - |
              # The fork source is the archive plane; the engine pool is separate.
              : "${HL_RPC_URL:?HL_RPC_URL is required}"
              # An explicit pin keeps the epoch across a source change. Without
              # it, re-resolve on *every container start* (k8s restarts only the
              # container on OOM): a fresh base is an epoch, and the driver
              # reconciles it from the shadow registry (same base -> restore,
              # new base -> clear). `cast` is in the image.
              if [ -n "${ANVIL_FORK_PIN:-}" ]; then
                PIN="$ANVIL_FORK_PIN"
              else
                PIN=$(cast block-number --rpc-url "$HL_RPC_URL" 2>/dev/null || echo 0)
                if [ "${PIN:-0}" -gt 0 ]; then
                  echo "$PIN" > /state/pin
                else
                  PIN=$(cat /state/pin 2>/dev/null || echo 0)
                  echo "fork source unreachable; keeping persisted pin $PIN" >&2
                fi
              fi
              echo "anvil-v: fork-url=$HL_RPC_URL pin=$PIN"
              # Why these flags (the parity list):
              #   --no-mining          the engine owns block production; without
              #                        it every cheatcode write automines and the
              #                        driver's mine(1) yields empty blocks (the
              #                        2026-10 automine-reset incident, T).
              #   --auto-impersonate   the bridge completes Core->EVM transfers
              #                        by sending the ERC20 *from* the system
              #                        address.
              #   --hardfork cancun    the real chain is Cancun-without-blobs;
              #                        pinning it is the faithful choice.
              #   --gas-limit 1e8      their HyperEVM arg.
              #   --code-size-limit    their entrypoint's deliberate 99999: an
              #                        oversize deploy must not surface at run
              #                        time.
              #   --prune-history 10000  the state window the proof path needs:
              #                        the indexer/operator can lag a service
              #                        restart by minutes, and a witness proof
              #                        reads `eth_getStorageAt` at the indexed
              #                        pin. 32 blocks (32 s at the mirror's
              #                        1 s cadence) is shorter than a normal
              #                        restart; 10 000 (~2.8 h) covers it.
              #   --transaction-block-keeper 10000  the forensic tx window.
              #                        The old 1e6 kept every tx/block forever
              #                        and was the measured OOM source: the
              #                        container hit its 16 GiB ceiling in ~1 h
              #                        (2026-11-02 02:19Z). 10 000 blocks is
              #                        ~2.8 h of the mirror's own history, which
              #                        is what the driver's failing-run reads need.
              exec anvil \
                --host 0.0.0.0 --port 8545 \
                --fork-url "$HL_RPC_URL" \
                --fork-block-number "$PIN" \
                --chain-id 999 \
                --hardfork cancun \
                --gas-limit 100000000 \
                --code-size-limit 99999 \
                --disable-pool-balance-checks \
                --order fifo \
                --no-mining \
                --auto-impersonate \
                --prune-history 10000 \
                --transaction-block-keeper 10000 \
                --state /state/anvil-state.json \
                --state-interval 300 \
                --no-rate-limit \
                --no-request-size-limit \
                --no-fork-node-info
          env:
            - name: HL_RPC_URL
              valueFrom: { configMapKeyRef: { name: diorama-config, key: HL_RPC_URL } }
            # Explicit epoch pin (see the init container's comment).
            - { name: ANVIL_FORK_PIN, value: "50748852" }
            # Fork RPC cache (~/.foundry/cache/rpc/...) lands on the PVC and is
            # flushed on SIGTERM, so restarts keep the read-through warm.
            - { name: HOME, value: /state }
          ports:
            - { name: http, containerPort: 8545 }
          volumeMounts:
            - { name: state, mountPath: /state }
          # The state file is loaded at startup and dumped on SIGTERM plus every
          # 300 s. The 2026-11-10 restores (08:42, 10:38) were graceful pod
          # replacements that re-forked at the pin and lost every block since it;
          # the dump preserves the chain across a rollout. An OOM kill is still
          # abrupt, so the limit is raised to 40 GiB and the periodic dump bounds
          # the loss to one interval.
          #
          # A restarted anvil forks before it can serve: gate readiness/liveness
          # behind a startup probe so k8s does not flap them during the fork.
          startupProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 5
            failureThreshold: 60 # up to 5 min to fork
          readinessProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 30
          resources:
            # Like T, V never executes source txs: it materializes the fork
            # state on demand and carries the devnet's own writes. Measured
            # 2026-10-31 (60 s sample): ~11-12m CPU, 619-625 MiB RSS. The
            # request covers that measured steady state; the 16 GiB ceiling is
            # the fork-materialization + write-volume headroom. The 2026-11-02
            # OOM at 16 GiB was not steady state: the 1e6 transaction keeper
            # retained every block/tx and grew without bound (fixed above to
            # 10k). Re-measure before changing either the keeper or the limit.
            requests: { cpu: "25m", memory: 768Mi }
            limits: { memory: 40Gi }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: anvil-v-state }
---
apiVersion: v1
kind: Service
metadata:
  name: anvil-v
  labels: { app.kubernetes.io/name: anvil-v, app.kubernetes.io/part-of: diorama-venue }
spec:
  selector: { app.kubernetes.io/name: anvil-v }
  ports:
    # anvil serves WebSocket upgrades on the same port as HTTP (daloc's
    # eth_subscribe rides ws://anvil-v:8545).
    - { name: http, port: 8545, targetPort: 8545 }
