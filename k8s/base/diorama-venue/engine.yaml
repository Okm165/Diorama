# engine - the Venue Mirror engine: the fork-driver loop over V, the at-pin
# probes, the epoch rule (same pin -> restore, new pin -> clear), the Core<->EVM
# bridge scan, and the admin surface (/admin/deal, /admin/shadow, /admin/epoch,
# /admin/pause, /admin/resume).
#
# Same shape as the mainnet engine deployment: the image carries the venue
# binary, the mounted instance file selects the profile, and the
# driver state (cursor, shadow registry, journal) lives on the engine-state PVC
# so restarts resume where they left.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/part-of: diorama-venue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
        app.kubernetes.io/part-of: diorama-venue
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: localhost/diorama-venue-engine:relay-320026d
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/mirror/instance.toml"]
          # No env: the configuration is the mounted specialization file
          # (/etc/mirror/specialization.toml beside the instance file). The
          # keyed market-REST mirror lives in the specialization's
          # [endpoints.hyperliquid_info] - gitignored, so the key never
          # enters a cluster Secret.
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
            - { name: state, mountPath: /state }
          # `/livez`, not `/healthz` (see the mainnet engine's manifest): the
          # paused state must not take the engine out of the Service or
          # restart the pod.
          # The boot-wait may outlast a dependency's own restart (the
          # engines wait for their anvil/reth, the bridge for two chains): a
          # startupProbe suspends the liveness/readiness probes through it, so
          # a coordinated rollout never kills a booting container (measured:
          # exit 137 at ~2 minutes when anvil-t restarted under a rolling
          # engine). This budget is the boot wait plus slack, not a second
          # guess: the instance's boot_timeout_secs is 1200 (a re-forking V),
          # so 150 x 10 s (25 min) lets the engine wait out V's own 20-minute
          # startupProbe and then serve.
          startupProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            failureThreshold: 150
          readinessProbe:
            # `/livez`, not `/healthz`: a gap-paused engine is still serving
            # reads/writes (it is catching up, not dead), so it must stay in
            # the Service. `/healthz` is the diagnostic state report (200 ok,
            # 503 halted/gap-paused); probing it here took the engine out of
            # rotation for the whole catch-up and starved its admin consumers.
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # No CPU limit (the follow's passes are latency-sensitive).
            # Measured 2026-10-31 (60 s sample): ~1-2m CPU, 8-10 MiB RSS. The
            # request tracks the measured steady state. The 512Mi limit was
            # measured OOM-killing the engine during the 2026-11-06 wide
            # catch-up (the composition state grows with the window, and a
            # restart resets the follow cursor to the pin). 2Gi is the OOM
            # ceiling for a wide catch-up window; the steady state stays tiny.
            requests: { cpu: "5m", memory: 64Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: instance
          configMap: { name: venue-instance }
        - name: state
          persistentVolumeClaim: { claimName: engine-state }
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: diorama-venue }
spec:
  selector: { app.kubernetes.io/name: engine }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
