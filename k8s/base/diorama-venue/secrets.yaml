# The instance's Secret inventory: the values the wiring marks
# `<VAR>_SECRET=1` (a provider key inside an RPC URL, a relay wallet). The
# values never enter git or a ConfigMap - `make secrets` writes them from the
# gitignored wiring.env into this object, which exists (possibly empty) on
# every instance so a pod never waits on a missing Secret: each pod's
# secretKeyRef is `optional: true`.
apiVersion: v1
kind: Secret
metadata:
  name: diorama-venue-secrets
  labels:
    app.kubernetes.io/part-of: diorama-venue
type: Opaque
stringData: {}
