# The Venue Mirror's manifest base: V (the fork-mode anvil), the venue engine,
# the simulator, and the instance's Secret inventory. The namespace, the
# instance ConfigMap and the harness services are the overlay's — the same
# split as k8s/base/diorama-mainnet. The cross-mirror CCTP bridge is its own
# base (k8s/base/cctp-bridge), not a venue specialization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../shared
  - pvcs.yaml
  - anvil-v.yaml
  - engine.yaml
  - venue-sim.yaml
