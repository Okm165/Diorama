# Shared runtime wiring for the Venue Mirror stack: the venue wiring env the
# instance TOML references as ${...}. Operational tunables live
# in config/instances/*.toml; this ConfigMap carries only deployment wiring,
# and the config loader is their only reader.
apiVersion: v1
kind: ConfigMap
metadata:
  name: diorama-config
  labels:
    app.kubernetes.io/part-of: diorama-venue
data:
  # The one HyperEVM URL list. The engine's read pool starts at a random
  # healthy entry, fails over on a transport/throttle/5xx fault, and cools a
  # failed entry down for a later round. Anvil takes one `--fork-url`, so its
  # entrypoint derives the primary as the first list entry — there is no
  # second `HL_RPC_URL` definition to drift.
  #
  # Only endpoints that answer `eth_getSystemTxsByBlockNumber` are listed:
  # dRPC and purroofgroup return -32601 for it, so including them would make
  # the venue source audit disagree on `system_txs`. The official HyperEVM RPC
  # is first; hypurrscan, stakely and onfinality are the fallbacks.
  # The archive endpoint is first because anvil-v's fork source must serve
  # historical storage, not only the head: the public free-plan endpoints
  # rate-limit a storage read at the pin (measured 2026-11-01, CCTP wiring
  # boot). The engine's read pool uses the rest as failover.
  HL_RPC_URLS: "https://rpc.hyperlend.finance/archive,https://rpc.hyperliquid.xyz/evm,https://rpc.hypurrscan.io,https://hyperliquid-json-rpc.stakely.io,https://hyperliquid.api.onfinality.io/evm/public"

  # The venue's market plane. Both are URL lists in the instance's
  # [endpoints] groups; the env carries the deployment values, never a second
  # literal in the TOML.
  HL_INFO_API_URL: "https://api.hyperliquid.xyz"
  HL_WS_API_URL: "wss://api.hyperliquid.xyz/ws"

  # The devnet chain and the engine's admin base, by in-namespace service DNS.
  ANVIL_V_URL: "http://anvil-v:8545"
  ENGINE_ADMIN_URL: "http://engine:8080"

  # The Ethereum fork the CCTP bridge burns on: anvil-t lives in the
  # diorama-mainnet namespace (the venue namespace has no T of its own), so the
  # bridge reaches it over cross-namespace service DNS.
  T_RPC_URL: "http://anvil-t.diorama-mainnet.svc.cluster.local:8545"

  # State roots on the pods' own PVCs (paths, not claims).
  STATE_DIR: "/state"
  SIM_STATE_DIR: "/state"
  CCTP_STATE_DIR: "/state"
