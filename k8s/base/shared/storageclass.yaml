# Dedicated StorageClass for the mirror: local-path provisioner with
# reclaimPolicy Retain, so deleting a PVC never deletes the underlying data.
# Recreate a PVC with the same name to re-attach an existing volume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: diorama-retain
  labels:
    app.kubernetes.io/part-of: devnet
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
