# The cluster-scoped resources every instance shares: the retain StorageClass.
# Included by each base (idempotent - it is the same object, created once and
# re-applied harmlessly by either stack).
#
# Retain: deleting a PVC never deletes the underlying data. Recreate a PVC
# with the same name to re-attach an existing volume. The name below is the
# one spelling of the claim class: every claim of every instance names this
# literal (a k8s-native fact, not Diorama configuration — the specialization
# carries no storage key), and a cluster with its own provisioner edits this
# file once on an empty cluster: a bound claim's class does not rebind.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mirror-retain
  labels:
    app.kubernetes.io/part-of: devnet
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
