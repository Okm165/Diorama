# anvil-t - the devnet chain (T).
#
# Same fork source and pin mechanics as anvil-m, but this is where your dapp
# writes. The engine keeps watch-list state fresh here by applying EIP-7928
# block access lists (never by replaying mainnet txs), and tracks your writes
# so parent diffs never overwrite them (copy-on-write, per slot; account
# fields as one unit).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-t
  labels:
    app.kubernetes.io/name: anvil-t
    app.kubernetes.io/part-of: mainnet-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil-t
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-t
        app.kubernetes.io/part-of: mainnet-mirror
    spec:
      # anvil dumps its state on SIGTERM; give it time.
      terminationGracePeriodSeconds: 90
      initContainers:
        # Resolve a *fresh* fork pin on every start, like M. T's old design kept
        # the pin stable so a restart could not lose the devnet's writes; the
        # engine now keeps those writes in the shadow registry's value map and
        # re-applies them after a re-fork (verified by killing the pod), so a
        # fresh pin is safe - and it bounds the post-restart re-replay to
        # FORK_OFFSET (~128 blocks, minutes) instead of the whole pin age.
        - name: resolve-pin
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Always wait for reth first, even when the pin is persisted:
              # anvil forks at start-up, so restarting while reth is restarting
              # would crash-loop (measured: "failed to fetch network chain ID").
              i=0; HEAD=""
              while [ -z "$HEAD" ] && [ "$i" -lt 240 ]; do
                HEAD=$(wget -qO- --header='Content-Type: application/json' \
                  --post-data='{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                  "$RETH_URL" 2>/dev/null \
                  | sed -n 's/.*"result":"\(0x[0-9a-fA-F]*\)".*/\1/p')
                [ -n "$HEAD" ] || { i=$((i+1)); sleep 5; }
              done
              [ -n "$HEAD" ] || { echo "ERROR: reth unreachable at $RETH_URL"; exit 1; }
              echo "resolving pin: $RETH_URL head - $FORK_OFFSET"
              PIN=$((HEAD - FORK_OFFSET))
              echo "$PIN" > /state/pin
              # The container runs unprivileged and re-resolves the pin on every
              # *container* start (k8s restarts only the container on OOM), so it
              # must be able to rewrite this file: without the chmod that write
              # failed with "Permission denied" and the persisted pin silently
              # aged with the pod (measured).
              chmod 0777 /state 2>/dev/null || true
              chmod 0666 /state/pin 2>/dev/null || true
              echo "resolved pin=$PIN (reth head=$HEAD)"
          env:
            - name: RETH_URL
              valueFrom: { configMapKeyRef: { name: mirror-config, key: RETH_URL } }
            - name: FORK_OFFSET
              valueFrom: { configMapKeyRef: { name: mirror-config, key: FORK_OFFSET } }
          volumeMounts:
            - { name: state, mountPath: /state }
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:v1.8.6@sha256:4a16a86f41d30418fbdca47ce2868121bbb0aeaa0a34bde2dd1e2911c4be2464
          # The image entrypoint is `/bin/sh -c` and swallows bare args; use a
          # shell wrapper and `exec` so SIGTERM reaches anvil (state dump).
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Re-resolve the pin on *every container start*, not just every
              # pod start: k8s restarts only the container on OOM (T's normal
              # cycle), so the init container's pin would age with the pod and
              # the post-restart replay would grow to the whole pin age (~1.5 h
              # measured). The engine restores the devnet's writes from the
              # shadow registry after a re-fork, so a fresh pin loses nothing.
              PIN=$(cast block-number --rpc-url "$RETH_URL" 2>/dev/null || echo 0)
              if [ "${PIN:-0}" -gt 0 ]; then
                PIN=$((PIN - FORK_OFFSET))
                echo "$PIN" > /state/pin
              else
                PIN=$(cat /state/pin 2>/dev/null || echo 0)
                echo "reth unreachable; keeping persisted pin $PIN" >&2
              fi
              echo "anvil-t: fork-url=$RETH_URL pin=$PIN"
              exec anvil \
                --host 0.0.0.0 --port 8545 \
                --fork-url "$RETH_URL" \
                --fork-block-number "$PIN" \
                --chain-id 1 \
                --hardfork bpo2 \
                --gas-limit 60000000 \
                --enable-tx-gas-limit \
                --code-size-limit 24576 \
                --disable-pool-balance-checks \
                --order fifo \
                # The engine owns block production on both chains: without this,
                # every raw tx / cheatcode write would automine its own block and
                # the engine's mine(1) would produce empty blocks (measured: the
                # 2026-10 automine-reset incident).
                --no-mining \
                --auto-impersonate \
                --prune-history 32 \
                --transaction-block-keeper 2 \
                --no-rate-limit \
                --no-request-size-limit \
                --no-fork-node-info \
          env:
            - name: RETH_URL
              valueFrom: { configMapKeyRef: { name: mirror-config, key: RETH_URL } }
            - name: FORK_OFFSET
              valueFrom: { configMapKeyRef: { name: mirror-config, key: FORK_OFFSET } }
            # Fork RPC cache (~/.foundry/cache/rpc/...) lands on the PVC and is
            # flushed on SIGTERM, so restarts keep the read-through warm.
            - { name: HOME, value: /state }
          ports:
            - { name: http, containerPort: 8545 }
          volumeMounts:
            - { name: state, mountPath: /state }
          # A restarted anvil forks (and, for M, re-replays) before it can
          # serve: gate readiness/liveness behind a startup probe so k8s does
          # not flap them during the catch-up (measured: "Readiness probe
          # failed: connection refused" events on every M restart).
          startupProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 5
            failureThreshold: 60 # up to 5 min to fork + catch up
          readinessProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            # T never executes mainnet txs (BAL diffs only), so its state stays
            # small; the resident set is dominated by the state-dump
            # serialization spike (~10 GiB measured with a ~5 GiB in-memory
            # state). 16Gi keeps a comfortable margin.
            limits: { memory: 16Gi }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: anvil-t-state }
---
apiVersion: v1
kind: Service
metadata:
  name: anvil-t
  labels: { app.kubernetes.io/name: anvil-t, app.kubernetes.io/part-of: mainnet-mirror }
spec:
  selector: { app.kubernetes.io/name: anvil-t }
  ports:
    # anvil serves WebSocket upgrades on the same port as HTTP (the plan's A18:
    # "delivery is event-driven" - eth_subscribe over ws://...:8545).
    - { name: http, port: 8545, targetPort: 8545 }
