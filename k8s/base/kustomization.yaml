# The mainnet-mirror base.
#
# The Venue Mirror's manifests live in base/venue/ (its own kustomization,
# included by k8s/overlays/venue-mirror) and are deliberately NOT listed here:
# a kustomize base cannot exclude resources, so listing them would deploy the
# venue stack into the mainnet-mirror namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mainnet-mirror

resources:
  - namespace.yaml
  - storageclass.yaml
  - mirror-config.yaml
  - reth-config.yaml
  - engine-config.yaml
  - pvcs.yaml
  - reth.yaml
  - lighthouse.yaml
  - anvil-m.yaml
  - anvil-t.yaml
  - engine.yaml
  - nodeports.yaml
