# engine - the Venue Mirror engine: the fork-driver loop over V, the at-pin
# probes, the epoch rule (same pin -> restore, new pin -> clear), the Core<->EVM
# bridge scan, and the admin surface (/admin/deal, /admin/shadow, /admin/epoch,
# /admin/pause, /admin/resume).
#
# Same shape as the mainnet engine deployment: the image carries the venue
# binary, the mounted instance file selects the profile (plan §19.5), and the
# driver state (cursor, shadow registry, journal) lives on the engine-state PVC
# so restarts resume where they left.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/part-of: venue-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
        app.kubernetes.io/part-of: venue-mirror
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: localhost/venue-engine:v1
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/mirror/instance.toml"]
          # The wiring the instance TOML references as ${...} (HL_RPC_URL,
          # ANVIL_V_URL, STATE_DIR) — the same `envFrom` mechanism as the
          # mainnet engine: the ConfigMap carries every key, the pod reads the
          # ones its instance names, and a new wiring var needs no edit here.
          envFrom:
            - configMapRef: { name: mirror-config }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
            - { name: state, mountPath: /state }
          # `/livez`, not `/healthz` (see the mainnet engine's manifest): the
          # paused state must not take the engine out of the Service or
          # restart the pod.
          readinessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: instance
          configMap: { name: venue-instance }
        - name: state
          persistentVolumeClaim: { claimName: engine-state }
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: venue-mirror }
spec:
  selector: { app.kubernetes.io/name: engine }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
