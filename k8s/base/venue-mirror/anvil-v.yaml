# anvil-v - the Venue Mirror's devnet chain (V, chain-id 999).
#
# A fork-mode anvil over the public HyperEVM RPC. There is no follow machinery
# and no fork offset (unlike T): the source is archive-deep (measured: >=5M
# blocks), so the pin is simply the source's latest block. The engine's epoch
# rule keys on this pin (persisted in /state/pin): a re-pin to a *different*
# base is a new epoch (the shadow registry is cleared, the simulator re-pins
# explicitly through /admin/epoch), the same base restores the recorded writes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-v
  labels:
    app.kubernetes.io/name: anvil-v
    app.kubernetes.io/part-of: venue-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil-v
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-v
        app.kubernetes.io/part-of: venue-mirror
    spec:
      # Give anvil time to shut down cleanly on SIGTERM.
      terminationGracePeriodSeconds: 90
      initContainers:
        # Resolve a *fresh* pin on every start, like T: the source serves
        # `latest` at archive depth, so a restart re-forks at a current block
        # and the driver reconciles it as an epoch on its next pass.
        - name: resolve-pin
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Wait for the fork source first: anvil forks at start-up, so a
              # restart while the source is unreachable would crash-loop.
              i=0; HEAD=""
              while [ -z "$HEAD" ] && [ "$i" -lt 240 ]; do
                HEAD=$(wget -qO- --header='Content-Type: application/json' \
                  --post-data='{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                  "$HL_RPC_URL" 2>/dev/null \
                  | sed -n 's/.*"result":"\(0x[0-9a-fA-F]*\)".*/\1/p')
                [ -n "$HEAD" ] || { i=$((i+1)); sleep 5; }
              done
              [ -n "$HEAD" ] || { echo "ERROR: fork source unreachable at $HL_RPC_URL"; exit 1; }
              PIN=$((HEAD))
              echo "$PIN" > /state/pin
              # The container runs unprivileged and re-resolves the pin on every
              # *container* start (k8s restarts only the container on OOM), so it
              # must be able to rewrite this file (measured on T: without the
              # chmod the write failed and the persisted pin silently aged).
              chmod 0777 /state 2>/dev/null || true
              chmod 0666 /state/pin 2>/dev/null || true
              echo "resolved pin=$PIN (source head=$HEAD)"
          env:
            - name: HL_RPC_URL
              valueFrom: { configMapKeyRef: { name: mirror-config, key: HL_RPC_URL } }
          volumeMounts:
            - { name: state, mountPath: /state }
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:v1.8.6@sha256:4a16a86f41d30418fbdca47ce2868121bbb0aeaa0a34bde2dd1e2911c4be2464
          # The image entrypoint is `/bin/sh -c` and swallows bare args; use a
          # shell wrapper and `exec` so SIGTERM reaches anvil (clean shutdown).
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Re-resolve the pin on *every container start*, not just every
              # pod start (k8s restarts only the container on OOM): a fresh
              # base is an epoch, and the driver reconciles it from the shadow
              # registry (same base -> restore, new base -> clear). `cast` is
              # in the image.
              PIN=$(cast block-number --rpc-url "$HL_RPC_URL" 2>/dev/null || echo 0)
              if [ "${PIN:-0}" -gt 0 ]; then
                echo "$PIN" > /state/pin
              else
                PIN=$(cat /state/pin 2>/dev/null || echo 0)
                echo "fork source unreachable; keeping persisted pin $PIN" >&2
              fi
              echo "anvil-v: fork-url=$HL_RPC_URL pin=$PIN"
              # Why these flags (parity list, plan §17.6/§7.6):
              #   --no-mining          the engine owns block production; without
              #                        it every cheatcode write automines and the
              #                        driver's mine(1) yields empty blocks (the
              #                        2026-10 automine-reset incident, T).
              #   --auto-impersonate   the bridge completes Core->EVM transfers
              #                        by sending the ERC20 *from* the system
              #                        address (plan §7.4).
              #   --hardfork cancun    the real chain is Cancun-without-blobs;
              #                        pinning it is the faithful choice.
              #   --gas-limit 1e8      their HyperEVM arg (plan §17.6).
              #   --code-size-limit    their entrypoint's deliberate 99999: an
              #                        oversize deploy must not surface at run
              #                        time.
              #   --transaction-block-keeper 1e6  their failing-run forensics
              #                        read the run's own chain; a shallow
              #                        keeper makes it unreadable seconds later.
              exec anvil \
                --host 0.0.0.0 --port 8545 \
                --fork-url "$HL_RPC_URL" \
                --fork-block-number "$PIN" \
                --chain-id 999 \
                --hardfork cancun \
                --gas-limit 100000000 \
                --code-size-limit 99999 \
                --disable-pool-balance-checks \
                --order fifo \
                --no-mining \
                --auto-impersonate \
                --prune-history 32 \
                --transaction-block-keeper 1000000 \
                --no-rate-limit \
                --no-request-size-limit \
                --no-fork-node-info
          env:
            - name: HL_RPC_URL
              valueFrom: { configMapKeyRef: { name: mirror-config, key: HL_RPC_URL } }
            # Fork RPC cache (~/.foundry/cache/rpc/...) lands on the PVC and is
            # flushed on SIGTERM, so restarts keep the read-through warm.
            - { name: HOME, value: /state }
          ports:
            - { name: http, containerPort: 8545 }
          volumeMounts:
            - { name: state, mountPath: /state }
          # A restarted anvil forks before it can serve: gate readiness/liveness
          # behind a startup probe so k8s does not flap them during the fork.
          startupProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 5
            failureThreshold: 60 # up to 5 min to fork
          readinessProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 30
          resources:
            # Like T, V never executes source txs: it materializes the fork
            # state on demand and carries the devnet's own writes (measured
            # ~50 MiB). The request covers the measured state; the limit
            # keeps a wide margin for the live follow's write volume.
            requests: { cpu: "500m", memory: 1Gi }
            limits: { memory: 4Gi }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: anvil-v-state }
---
apiVersion: v1
kind: Service
metadata:
  name: anvil-v
  labels: { app.kubernetes.io/name: anvil-v, app.kubernetes.io/part-of: venue-mirror }
spec:
  selector: { app.kubernetes.io/name: anvil-v }
  ports:
    # anvil serves WebSocket upgrades on the same port as HTTP (daloc's
    # eth_subscribe rides ws://anvil-v:8545).
    - { name: http, port: 8545, targetPort: 8545 }
