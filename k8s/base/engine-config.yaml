# engine.yaml - runtime configuration for the mirror engine.
#
# The engine drives two chains from the local reth head:
#   M (anvil-m): strict replay of every parent block + per-block verification.
#   T (anvil-t): the devnet. Watch-list state kept fresh by EIP-7928 BAL diffs;
#                never replays mainnet txs (your writes live here).
apiVersion: v1
kind: ConfigMap
metadata:
  name: engine-config
  labels:
    app.kubernetes.io/part-of: mainnet-mirror
data:
  engine.yaml: |
    reth:
      url: http://reth:8545
      # Follow `latest` (the CL head): the parent stream then advances one block
      # per ~12 s, so T mines one block per ~12 s and devnet transactions
      # confirm in ~12 s (measured with `safe`: the safe tag jumps 32 blocks per
      # epoch, so the applier burst-mines every ~6.4 min and a devnet tx waits
      # minutes - a fork that does not confirm is not a fork). The rare shallow
      # reorg is handled by the continuity check + the M re-base path
      # (metrics: mirror_reorgs_detected_total).
      follow: latest
      # Replay 2 blocks behind the head: the beacon cannot serve blob sidecars
      # for the newest block yet, and every blob block would hold M and retry
      # (measured: 20 retry errors / 20 min without the margin).
      follow_margin_blocks: 2
      request_timeout_secs: 30

    anvil:
      m_url: http://anvil-m:8545
      t_url: http://anvil-t:8545

    # Top-up sync (EIP-8379 choreography): the engine feeds reth the execution
    # payloads it is missing, straight from the local Lighthouse over reth's
    # authenticated Engine API. This is what makes the mirror self-contained -
    # no EL P2P peers and no public RPC are needed to close a gap after the
    # checkpoint sync or an EL restart.
    source_sync:
      enabled: true
      interval_ms: 1000
      max_per_pass: 256
      engine_url: http://reth:8551
      jwt_path: /secrets/jwt.hex

    loops:
      poll_interval_ms: 1000
      # Replay/apply is always contiguous from the chain's own head: on first
      # start that is the pin + 1, so the whole pin window (FORK_OFFSET, 128
      # blocks) is replayed as the warm-up; restarts resume at cursor + 1.
      # Refuse to catch up when the follow head is further than this ahead of
      # the cursor: the plan's ops rule ("> 300 -> pause and re-sync"). A
      # *rebased* cursor (a fresh pin after a restart or a T re-fork) is exempt
      # and may replay its whole pin window, bounded by reth's 10,064-block
      # state window - otherwise a T restart could never warm up.
      max_gap_blocks: 300
      # Blocks between the follow head and M's fork base when the engine has
      # to re-base M: the safe head can move backward (CL forkchoice), and M's
      # replay is irreversible, so the mirror re-forks behind it instead of
      # stalling until the safe head catches up. Keep in sync with
      # mirror-config's FORK_OFFSET.
      fork_offset: 128
      # Max JSON-RPC batch size for raw-tx submissions and cheatcode writes.
      chunk_size: 500
      replay_into_m: true
      apply_into_t: true
      # Converge M from the parent BAL before each replay: a fork cannot
      # reproduce blockhash-dependent values (A17; e.g. Seaport 1.6 counters use
      # blockhash(n-1)), and without convergence one divergence cascades into
      # invalid txs and permanently wrong state. With it, M stays a faithful
      # mirror while still executing every tx (traces + verification).
      repair_m: true
      # continue (default): record every divergence in drift.jsonl + metrics and
      #   keep replaying. M's state is converged from the parent BAL before each
      #   block, so divergences never cascade. Measured: a fork cannot reproduce
      #   blockhash-dependent values (A17; e.g. Seaport 1.6 counters, near-full
      #   blocks where a small gas delta pushes the last txs out), so freezing
      #   would stall the mirror permanently.
      # freeze_m: stop replaying into M on divergence (T keeps syncing).
      # halt_all: stop both loops. Use these for conformance runs.
      on_divergence: continue

    verifier:
      enabled: true
      # Each block is verified against reth: tx count/order, blob gas, receipts
      # (count/status/gas), logs (bloom + full set), withdrawals, and state
      # probes. Divergences are classified structural (tx count/order, blob gas,
      # withdrawals) vs
      # behavioral (receipt statuses/gas, logs, values - the blockhash-gated
      # class; real execution problems surface via the convergence probes) in
      # drift.jsonl and metrics; both are recorded.
      # After the repair the probes are re-run against M: convergence_failures
      # staying at 0 is the "M is an exact mirror" health signal.
      drift_sample_keys: 8
      # EIP-7702: fork gas delta must lie in [-refund * #auths, 0].
      type4_refund_per_auth: 12500
      probes:
        - name: usdc_total_supply
          to: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
          data: "0x18160ddd"
        - name: weth_total_supply
          to: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
          data: "0x18160ddd"
        - name: chainlink_weth_usd
          to: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"
          data: "0xfeaf968c"
        - name: univ3_weth_usdc_slot0
          to: "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"
          data: "0x3850c7bd"
        # scaledTotalSupply, not totalSupply: the aToken's totalSupply is
        # `scaled * liquidityIndex`, and the devnet's own reserve actions
        # re-price the index at a different second than mainnet's last update -
        # a dust drift (measured 7.8e-13 aUSDC) that an exact probe cannot tell
        # from a real divergence. The scaled value is index-independent and
        # still catches any real supply/withdraw divergence.
        - name: aave_aethusdc_scaled_total_supply
          to: "0x98C23E9d8f34FEFb1B7BD6a91B7FF122F4e16F5c"
          data: "0xb1bf962d"
        # The oracle's price proves the interaction closure: it only matches
        # reth when the oracle *and* its source contracts are watched.
        - name: aave_usdc_price
          to: "0x54586bE62E3c3580375aE3723C145253060Ca0C2"
          data: "0xb3596f07000000000000000000000000A0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        # WETH's source is a proxy whose aggregator was missing from the watch
        # list; its price froze while USDC's stayed live. One WETH price probe
        # makes that class of gap an alarm instead of a silent staleness.
        - name: aave_weth_price
          to: "0x54586bE62E3c3580375aE3723C145253060Ca0C2"
          data: "0xb3596f07000000000000000000000000C02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
        # The full price closure: the composite WBTC source and the other
        # reserves get the same probe the WETH source has, so a missing
        # aggregator behind a *composite* source is an alarm, not a silent
        # staleness (measured: the WBTC price sat stale while all probes stayed
        # green, 2026-10).
        - name: aave_wbtc_price
          to: "0x54586bE62E3c3580375aE3723C145253060Ca0C2"
          data: "0xb3596f070000000000000000000000002260FAC5E5542a773Aa44fBCfeDf7C193bc2C599"
        - name: aave_usdt_price
          to: "0x54586bE62E3c3580375aE3723C145253060Ca0C2"
          data: "0xb3596f07000000000000000000000000dAC17F958D2ee523a2206206994597C13D831ec7"
        - name: aave_wsteth_price
          to: "0x54586bE62E3c3580375aE3723C145253060Ca0C2"
          data: "0xb3596f070000000000000000000000007f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0"
        - name: aave_usdc_normalized_income
          to: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
          data: "0xd15e0053000000000000000000000000A0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"

    # Blob sidecar sources, tried in order. Local Lighthouse first; the public
    # beacon API covers blocks older than Lighthouse's checkpoint/backfill
    # (and any local beacon outage). A block whose blob txs cannot be fully
    # reconstructed is never mined: M stays strict.
    blobs:
      enabled: true
      # Sidecar sources, tried in order. Self-contained: the only source is our
      # own Lighthouse, which runs as a PeerDAS semi-supernode (half the data
      # columns = enough to reconstruct every blob) for the 18-day availability
      # window. A regular (non-supernode) node CANNOT reconstruct blobs after
      # EIP-7594 - it answers HTTP 400 "Insufficient data columns to reconstruct
      # blobs: required 64, but only 4 were found. You may need to run the
      # beacon node with --supernode or --semi-supernode." (measured).
      # Every candidate is KZG-validated (c-kzg + bundled mainnet trusted setup)
      # per blob tx before it is sent; Fulu placeholder proofs (0xc0..) are
      # recomputed locally, so a source that cannot reconstruct blobs can never
      # poison the pool.
      beacon_urls:
        - http://lighthouse:5052

    # Watch list seed (plan section 3.5). All slots of a watched account are
    # synced on T; shadowed keys are skipped (COW). Extend with your own
    # deployment addresses from contracts/deployments/ethereum.json.
    watchlist:
      # Chainlink feeds (config/oracles/ethereum.toml)
      - { address: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419", note: "Chainlink WETH/USD" }
      - { address: "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c", note: "Chainlink WBTC/USD" }
      - { address: "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8", note: "Chainlink STETH/USD" }
      - { address: "0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6", note: "Chainlink USDC/USD" }
      - { address: "0x3E7d1eAB13ad0104d2750B8863b489D65364e32D", note: "Chainlink USDT/USD" }
      # Chainlink feeds are AggregatorProxy contracts: `latestRoundData()` is a
      # delegatecall into the *current aggregator*, whose storage holds the
      # round. Watching only the proxy leaves the price stale on T (measured:
      # the probe diverged by one round). Resolve with `aggregator()` (0x245a7bfc)
      # and re-check after a feed upgrade - the aggregator address changes.
      - { address: "0x7d4e742018fb52e48b08be73d041c18b21de6fb5", note: "Chainlink WETH/USD aggregator" }
      - { address: "0x4a3411ac2948b33c69666b35cc6d055b27ea84f1", note: "Chainlink WBTC/USD aggregator" }
      - { address: "0x26f196806f43e88fd27798c9e3fb8fdf4618240f", note: "Chainlink STETH/USD aggregator" }
      - { address: "0x54bcc589d9743e521c64233706fc8cb36d275b07", note: "Chainlink USDC/USD aggregator" }
      - { address: "0x9c41663bb8d6800c8050e2fbf98e86ad01c973e3", note: "Chainlink USDT/USD aggregator" }
      # Assets (config/assets/*.toml)
      - { address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", note: "USDC" }
      - { address: "0xdAC17F958D2ee523a2206206994597C13D831ec7", note: "USDT" }
      - { address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", note: "WETH" }
      - { address: "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599", note: "WBTC" }
      - { address: "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0", note: "wstETH" }
      # Uniswap
      - { address: "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45", note: "Universal Router" }
      - { address: "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640", note: "UniV3 WETH/USDC 0.05%" }
      # The dapp's own mainnet deployment (plan §3.5). Only the hub is fully
      # specified in the plan; the beacon/factory/timelock/registries are
      # truncated there - add them from contracts/deployments/ethereum.json.
      # (The plan's "whale" addresses hold zero balances today, so they are
      # deliberately not watched; fund scenarios with the cheatcodes instead.)
      - { address: "0xDA10C0070a117b6e97EC01E983236F9D39E3152d", note: "dapp hub" }
      # Aave V3 (cascade scenario)
      - { address: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2", note: "Aave V3 Pool" }
      - { address: "0x54586bE62E3c3580375aE3723C145253060Ca0C2", note: "Aave V3 Oracle" }
      - { address: "0x2f39d218133AFaB8F2B819B1066c7E434Ad94E9e", note: "Aave V3 PoolAddressesProvider" }
      - { address: "0x98C23E9d8f34FEFb1B7BD6a91B7FF122F4e16F5c", note: "aEthUSDC" }
      - { address: "0x4d5F47FA6A74757f35C14fD3a6Ef8E3C9BC514E8", note: "aEthWETH" }
      - { address: "0x23878914EFE38d27C4D67Ab83ed1b93A74D4086a", note: "aEthUSDT" }
      - { address: "0x5Ee5bf7ae06D1Be5997A1A72006FE6C607eC6DE8", note: "aEthWBTC" }
      - { address: "0x0B925eD163218f6662a35e0f0371Ac234f9E9371", note: "aEthwstETH" }
      # The debt tokens are part of the same closure: a devnet borrow writes the
      # user's scaled debt *there*, and without the entry those writes are not
      # tracked, so `/admin/shadow {all:true}` cannot clear them - leaving a
      # phantom debt that makes the next run's borrow fail with
      # LtvValidationFailed (measured: $315 against zero collateral). Resolve:
      #   cast call $POOL "getReserveVariableDebtToken(address)(address)" $ASSET
      - { address: "0x72E95b8931767C79bA4EeE721354d6E99a61D004", note: "variableDebtUSDC" }
      - { address: "0x6df1C1E379bC5a00a7b4C6e67A203333772f45A8", note: "variableDebtUSDT" }
      - { address: "0xeA51d7853EEFb32b6ee06b1C12E6dcCA88Be0fFE", note: "variableDebtWETH" }
      - { address: "0x40aAbEf1aa8f0eEc637E0E7d92fbfFB2F26A8b7B", note: "variableDebtWBTC" }
      - { address: "0xC96113eED8cAB59cD8A66813bCB0cEb29F06D2e4", note: "variableDebtwstETH" }
      - { address: "0xD322A49006FC828F9B5B37Ab215F99B4E5caB19C", note: "Aave V3 WETH Gateway" }
      # Interaction closure (plan §3.5: "closed under interaction") - derived
      # on-chain; re-derive after a feed upgrade:
      #   oracle sources: cast call $ORACLE "getSourceOfAsset(address)(address)" $ASSET
      #   rate strategy:  cast call $POOL "getReserveData(address)(...)" $ASSET  (12th field)
      #   ACL manager:    cast call $PROVIDER "getACLManager()(address)"
      # Without them the devnet reads a pin-era Aave price/rate even though the
      # pool and oracle themselves stay fresh.
      - { address: "0xc2aaCf6553D20d1e9d78E365AAba8032af9c85b0", note: "Aave V3 ACLManager" }
      - { address: "0x9ec6F08190DeA04A54f8Afc53Db96134e5E3FdFB", note: "Aave V3 rate strategy (shared by all reserves)" }
      - { address: "0x3f73F03aa83B2A48ed27E964eD0fDb590332095B", note: "Aave oracle source: USDC/USD" }
      - { address: "0x260326c220E469358846b187eE53328303Efe19C", note: "Aave oracle source: USDT/USD" }
      - { address: "0x5424384B256154046E9667dDFaaa5e550145215e", note: "Aave oracle source: WETH/USD" }
      # The WETH/USD source is itself an AggregatorProxy: `latestRoundData()`
      # delegatecalls into its aggregator, so watching only the source leaves
      # the price frozen at the pin era (measured: 8 rounds / ~$44 stale, while
      # USDC's direct-aggregator source stayed fresh and hid the gap). The other
      # four sources answered `aggregator()` with no data - they are direct
      # aggregators and need no extra entry. Re-resolve after a feed upgrade:
      #   cast call <source> "aggregator()(address)" --rpc-url $RETH
      - { address: "0x7c7FdFCa295a787ded12Bb5c1A49A8D2cC20E3F8", note: "Aave oracle source: WETH/USD aggregator" }
      - { address: "0xDaa4B74C6bAc4e25188e64ebc68DB5050b690cAc", note: "Aave oracle source: WBTC/USD" }
      # Found by `make closure-check` (it traces each view's storage reads):
      # the USDC source is a CAPO wrapper with its own ratio feeds, and the
      # wstETH source reads stETH's share rate (updated daily - T would go
      # stale within a day while every probe stayed green).
      - { address: "0xcc31418a98f7afc4a9e2f8ea8fa6cbd4dbb4c9f7", note: "Aave USDC source: CAPO ratio feed" }
      - { address: "0xea674bbc33ae708bc9eb4ba348b04e4eb55b496b", note: "Aave USDC source: CAPO ratio feed" }
      - { address: "0xae7ab96520de3a18e5e111b5eaab095312d7fe84", note: "stETH (wstETH source reads the share rate)" }
      - { address: "0xb8ffc3cd6e7cf5a098a1c92f48009765b24088dc", note: "Aave wstETH source: storage dependency" }
      # The WBTC source is *composite* (BTC/USD x WBTC/BTC), built from two
      # proxy->aggregator pairs. Missing these made the WBTC price stale on T
      # while every probe stayed green (found by the product sim's broad
      # freshness audit, 2026-10): the aggregators hold the round data, so they
      # must be watched, not just the source.
      - { address: "0xb41e773f507f7a7ea890b1afb7d2b660c30c8b0a", note: "Aave WBTC source: BTC/USD proxy" }
      - { address: "0xdc715c751f1cc129a6b47fedc87d9918a4580502", note: "Aave WBTC source: BTC/USD aggregator" }
      - { address: "0xfdfd9c85ad200c506cf9e21f1fd8dd01932fbb23", note: "Aave WBTC source: WBTC/BTC proxy" }
      - { address: "0xa5e3a55cea42b86560a5215094981c300899199d", note: "Aave WBTC source: WBTC/BTC aggregator" }
      - { address: "0xe1D97bF61901B075E9626c8A2340a7De385861Ef", note: "Aave oracle source: wstETH/USD" }

    journal:
      dir: /state/journal
      blocks: 1024

    state_dir: /state

    http:
      addr: 0.0.0.0
      port: 8080
