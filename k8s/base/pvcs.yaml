# Persistent volumes for the mirror. All use the mirror-retain StorageClass
# (reclaimPolicy: Retain) so deleting a PVC never destroys the data.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reth-data
  labels: { app.kubernetes.io/part-of: mainnet-mirror, app: reth }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mirror-retain
  resources:
    requests:
      storage: 400Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lighthouse-data
  labels: { app.kubernetes.io/part-of: mainnet-mirror, app: lighthouse }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mirror-retain
  resources:
    requests:
      storage: 30Gi
---
