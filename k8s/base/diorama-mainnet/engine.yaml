# engine - the Mainnet Mirror engine: the BAL applier (T), the shadow scan,
# the state probes, the top-up loop (the local CL -> reth), the feed bridge,
# and the admin surface (/admin/epoch, /admin/shadow, /admin/feed, /admin/time,
# /admin/rewind).
#
# Same shape as the venue engine deployment: the image carries the mainnet
# binary, the mounted instance file selects the profile, and the
# state (cursor, journal, shadow registry, drift log) lives on the engine-state
# PVC so restarts resume where they left.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/part-of: diorama-mainnet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
        app.kubernetes.io/part-of: diorama-mainnet
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: localhost/diorama-mainnet-engine:v1
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/mirror/instance.toml"]
          # The wiring the instance TOML references as ${...} (RETH_URL,
          # ANVIL_T_URL, BEACON_URL, ENGINE_API_URL, JWT_PATH, STATE_DIR).
          envFrom:
            - configMapRef: { name: diorama-config }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
            - { name: state, mountPath: /state }
            # Shared with reth + lighthouse: the engine calls reth's authrpc
            # (Engine API) to run the top-up loop that keeps reth at the CL head
            # without any P2P peers.
            - { name: jwt, mountPath: /secrets, readOnly: true }
          # `/livez`, not `/healthz`: the engine's healthz reports its own
          # state (503 while paused), and probing it would drop the pod (and
          # its NodePort) out of rotation — and eventually restart it — in the
          # middle of a documented pause drill, while the contract says a
          # paused engine keeps serving reads and writes.
          # The boot-wait may outlast a dependency's own restart (the
          # engines wait for their anvil/reth, the bridge for two chains): a
          # startupProbe suspends the liveness/readiness probes through it, so
          # a coordinated rollout never kills a booting container (measured:
          # exit 137 at ~2 minutes when anvil-t restarted under a rolling
          # engine).
          startupProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # No CPU limit (the applier's passes are latency-sensitive);
            # measured steady state ~25 MiB, the limit leaves a wide margin
            # for a wide window's composition state.
            requests: { cpu: "50m", memory: 192Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: instance
          configMap: { name: mainnet-instance }
        - name: state
          persistentVolumeClaim: { claimName: engine-state }
        - name: jwt
          secret: { secretName: reth-jwt }
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: diorama-mainnet }
spec:
  selector: { app.kubernetes.io/name: engine }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
