# engine - the Mainnet Mirror engine: the BAL applier (T), the shadow scan,
# the state probes, the feed bridge, and the admin surface (/admin/epoch,
# /admin/shadow, /admin/feed, /admin/time, /admin/rewind).
#
# Chain 1 is read over the LAN from the source host's reth; this host runs no
# execution/consensus node and no top-up loop (the source host's engine owns
# reth's single CL writer).
#
# Same shape as the venue engine deployment: the image carries the mainnet
# binary, the mounted instance file selects the profile, and the
# state (cursor, journal, shadow registry, drift log) lives on the engine-state
# PVC so restarts resume where they left.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/part-of: diorama-mainnet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
        app.kubernetes.io/part-of: diorama-mainnet
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: engine
          image: localhost/diorama-mainnet-engine:v18
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/mirror/instance.toml"]
          # No env: the configuration is the mounted specialization file
          # (/etc/mirror/specialization.toml beside the instance file). The
          # specialization is the only per-deployment source of truth.
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
            - { name: state, mountPath: /state }
          # `/livez`, not `/healthz`: the engine's healthz reports its own
          # state (503 while paused), and probing it would drop the pod out of
          # its Service — and eventually restart it — in the middle of a
          # documented pause drill, while the contract says a paused engine
          # keeps serving reads and writes.
          # The boot-wait may outlast a dependency's own restart (the
          # engines wait for their anvil/reth, the bridge for two chains): a
          # startupProbe suspends the liveness/readiness probes through it, so
          # a coordinated rollout never kills a booting container (measured:
          # exit 137 at ~2 minutes when anvil-t restarted under a rolling
          # engine). The 30 x 10 s window (5 min) was shorter than a reth
          # restart; 90 x 10 s (15 min) covers the measured ~10 min outage.
          startupProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            # `/livez`, not `/healthz`: a gap-paused engine is still serving
            # reads/writes (it is catching up, not dead), so it must stay in
            # the Service. `/healthz` is the diagnostic state report (200 ok,
            # 503 halted/gap-paused); probing it here took the engine out of
            # rotation for the whole catch-up and starved its admin consumers.
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # No CPU limit (the applier's passes are latency-sensitive).
            # Measured 2026-11-18: ~4m CPU, 63 MiB RSS — the request was the
            # 2026-10-31 steady state (32 Mi) and the pod now uses 2× it, so
            # the node's 2026-11-18 memory sweep ranked the engine an easy
            # victim (OOMKilled alongside anvil-t; the journal resume made it
            # recoverable, but the BAL application silently stopped for the
            # restart's duration). The request covers the measured working
            # set; the limit stays the OOM ceiling for a wide window's
            # composition state.
            requests: { cpu: "10m", memory: 64Mi }
            # 2026-11-06: the 512Mi ceiling OOMed during a wide-window
            # composition (exit 137 at 13:50Z). The venue engine was already
            # raised to 2Gi for the same reason; match it. The applier is
            # stateless and resumes from the journal.
            limits: { memory: 2Gi }
      volumes:
        - name: instance
          configMap: { name: mainnet-instance }
        - name: state
          persistentVolumeClaim: { claimName: engine-state }
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: diorama-mainnet }
spec:
  selector: { app.kubernetes.io/name: engine }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
