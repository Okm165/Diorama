# Shared runtime wiring for the Mainnet Mirror stack: the L1 wiring env the
# instance TOML references as ${...}. Operational tunables live
# in config/instances/*.toml; this ConfigMap carries only deployment wiring,
# and the config loader is their only reader.
apiVersion: v1
kind: ConfigMap
metadata:
  name: diorama-config
  labels:
    app.kubernetes.io/part-of: diorama-mainnet
data:
  # Local fork source (reth). Never point this at a remote endpoint in
  # production mode: remote mining is 55-256 s/block (measured).
  RETH_URL: "http://reth:8545"

  # The chain endpoint the engine drives, plus the beacon/engine-api/JWT
  # wiring for the top-up loop (EIP-8379). The fork offset's single home is
  # [chains.l1].fork_offset in the instance file - the anvil pod reads it from
  # the mounted TOML, so it is not repeated here.
  ANVIL_T_URL: "http://anvil-t:8545"
  BEACON_URL: "http://lighthouse:5052"
  ENGINE_API_URL: "http://reth:8551"
  JWT_PATH: "/secrets/jwt.hex"
  STATE_DIR: "/state"

  # Lighthouse checkpoint sync (fresh CL head without genesis sync). One URL:
  # lighthouse takes no fallback argument, so a dead provider is an operator
  # switch of this value (beaconcha.in's sync endpoint is the known-good
  # alternative - OPERATIONS, "sync stuck").
  CHECKPOINT_SYNC_URL: "https://mainnet-checkpoint-sync.stakely.io"
