# anvil-t - the devnet chain (T).
#
# The devnet chain: forks the same source and resolves its pin with the same
# mechanics, but this is where your dapp
# writes. The engine keeps watch-list state fresh here by applying EIP-7928
# block access lists (never by replaying mainnet txs), and tracks your writes
# so parent diffs never overwrite them (copy-on-write, per slot; account
# fields as one unit).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-t
  labels:
    app.kubernetes.io/name: anvil-t
    app.kubernetes.io/part-of: diorama-mainnet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil-t
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-t
        app.kubernetes.io/part-of: diorama-mainnet
    spec:
      # Give anvil time to shut down cleanly on SIGTERM.
      terminationGracePeriodSeconds: 90
      initContainers:
        # Resolve a *fresh* fork pin on every start. That bounds the
        # post-restart re-fork to FORK_OFFSET (~128 blocks, minutes) instead
        # of the whole pin age - and a fresh pin is a *new epoch*: the base
        # moved, so the engine clears the shadow registry (marks *and* values)
        # and the devnet starts clean. Re-create positions from your journal;
        # a value-restore onto a moved base mixes eras (measured: a future
        # lastUpdateTimestamp made every Aave supply panic).
        - name: resolve-pin
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # The fork source is the specialization's read pool's primary
              # entry ([endpoints.evm] http[0]) — the same URL the engine's
              # `/admin/epoch` re-pins against. One fact, one spelling: this
              # is a read of the mounted file, never an env.
              EVM_URL=$(awk '/^\[endpoints\.evm\]/{f=1;next} /^\[/{f=0} f && /^http[[:space:]]*=/{match($0,/"[^"]*"/); print substr($0,RSTART+1,RLENGTH-2); exit}' /etc/mirror/specialization.toml)
              [ -n "$EVM_URL" ] || { echo "ERROR: fork source missing from /etc/mirror/specialization.toml ([endpoints.evm] http)"; exit 1; }
              # Always wait for reth first, even when the pin is persisted:
              # anvil forks at start-up, so restarting while reth is restarting
              # would crash-loop (measured: "failed to fetch network chain ID").
              i=0; HEAD=""
              while [ -z "$HEAD" ] && [ "$i" -lt 240 ]; do
                HEAD=$(wget -qO- --header='Content-Type: application/json' \
                  --post-data='{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
                  "$EVM_URL" 2>/dev/null \
                  | sed -n 's/.*"result":"\(0x[0-9a-fA-F]*\)".*/\1/p')
                [ -n "$HEAD" ] || { i=$((i+1)); sleep 5; }
              done
              [ -n "$HEAD" ] || { echo "ERROR: reth unreachable at $EVM_URL"; exit 1; }
              # A configured fork_pin preserves the deployment epoch. The
              # chain-1 mirror carries the only project contract deployment;
              # re-resolving a fresh base on every restart makes the engine
              # treat the restart as a new epoch and clear its shadow
              # registry — the deployed CMs/Underwriter then vanish and the
              # books become codeless (measured 2026-11-02: all chain-1
              # project addresses returned 0x after the 07:40Z re-fork).
              # A deployment that must keep its writes pins the block in the
              # specialization TOML; the instance file is the fallback.
              FORK_PIN=$(sed -n 's/^fork_pin[[:space:]]*=[[:space:]]*\([0-9_]*\).*/\1/p' \
                /etc/mirror/specialization.toml /etc/mirror/instance.toml 2>/dev/null | head -n1 | tr -d '_')
              if [ -n "$FORK_PIN" ]; then
                PIN="$FORK_PIN"
                echo "$PIN" > /state/pin
                echo "using configured fork pin=$PIN (reth head not re-resolved)"
                chmod 0777 /state 2>/dev/null || true
                chmod 0666 /state/pin 2>/dev/null || true
                exit 0
              fi
              # The offset's single home is the instance TOML:
              # this is a read of the mounted file, not a second definition.
              FORK_OFFSET=$(sed -n 's/^fork_offset[[:space:]]*=[[:space:]]*\([0-9_]*\).*/\1/p' /etc/mirror/instance.toml | tr -d '_')
              [ -n "$FORK_OFFSET" ] || { echo "ERROR: fork_offset missing from /etc/mirror/instance.toml"; exit 1; }
              echo "resolving pin: $EVM_URL head - $FORK_OFFSET"
              PIN=$((HEAD - FORK_OFFSET))
              echo "$PIN" > /state/pin
              # The container runs unprivileged and re-resolves the pin on every
              # *container* start (k8s restarts only the container on OOM), so it
              # must be able to rewrite this file: without the chmod that write
              # failed with "Permission denied" and the persisted pin silently
              # aged with the pod (measured).
              chmod 0777 /state 2>/dev/null || true
              chmod 0666 /state/pin 2>/dev/null || true
              echo "resolved pin=$PIN (reth head=$HEAD)"
          # No env: the fork source comes from the mounted specialization
          # file, read above.
          # Same bound as the venue's init (a short shell+wget loop): without
          # a request the pod is BestEffort and the node's accounting misses
          # it; the limit keeps a runaway loop from holding the node.
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - { name: state, mountPath: /state }
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:v1.8.6@sha256:4a16a86f41d30418fbdca47ce2868121bbb0aeaa0a34bde2dd1e2911c4be2464
          # The image entrypoint is `/bin/sh -c` and swallows bare args; use a
          # shell wrapper and `exec` so SIGTERM reaches anvil (clean shutdown).
          command: ["/bin/sh", "-c"]
          args:
            - |
              # The fork source is the specialization's read pool's primary
              # entry ([endpoints.evm] http[0]) — the same URL the engine's
              # `/admin/epoch` re-pins against. One fact, one spelling: a
              # read of the mounted file, never an env.
              EVM_URL=$(awk '/^\[endpoints\.evm\]/{f=1;next} /^\[/{f=0} f && /^http[[:space:]]*=/{match($0,/"[^"]*"/); print substr($0,RSTART+1,RLENGTH-2); exit}' /etc/mirror/specialization.toml)
              [ -n "$EVM_URL" ] || { echo "ERROR: fork source missing from /etc/mirror/specialization.toml ([endpoints.evm] http)"; exit 1; }
              # Re-resolve the pin on *every container start*, not just every
              # pod start: k8s restarts only the container on OOM (T's normal
              # cycle), so the init container's pin would age with the pod and
              # the post-restart replay would grow to the whole pin age (~1.5 h
              # measured). The engine restores the devnet's writes from the
              # shadow registry after a same-pin re-fork. An explicit pin is
              # required once the chain carries a project deployment: a fresh
              # base is a new epoch, and the engine clears the shadow registry
              # — the 2026-11-02 07:40Z re-fork left every chain-1 project
              # address codeless for exactly this reason.
              # The offset's single home is the instance TOML:
              # this is a read of the mounted file, not a second definition.
              FORK_OFFSET=$(sed -n 's/^fork_offset[[:space:]]*=[[:space:]]*\([0-9_]*\).*/\1/p' /etc/mirror/instance.toml | tr -d '_')
              [ -n "$FORK_OFFSET" ] || { echo "ERROR: fork_offset missing from /etc/mirror/instance.toml"; exit 1; }
              FORK_PIN=$(sed -n 's/^fork_pin[[:space:]]*=[[:space:]]*\([0-9_]*\).*/\1/p' \
                /etc/mirror/specialization.toml /etc/mirror/instance.toml 2>/dev/null | head -n1 | tr -d '_')
              if [ -n "$FORK_PIN" ]; then
                PIN="$FORK_PIN"
              else
                PIN=$(cast block-number --rpc-url "$EVM_URL" 2>/dev/null || echo 0)
                if [ "${PIN:-0}" -gt 0 ]; then
                  PIN=$((PIN - FORK_OFFSET))
                  echo "$PIN" > /state/pin
                else
                  PIN=$(cat /state/pin 2>/dev/null || echo 0)
                  echo "reth unreachable; keeping persisted pin $PIN" >&2
                fi
              fi
              echo "anvil-t: fork-url=$EVM_URL pin=$PIN"
              # The engine owns block production on both chains: without
              # --no-mining, every raw tx / cheatcode write would automine its
              # own block and the engine's mine(1) would produce empty blocks
              # (measured: the 2026-10 automine-reset incident). Comments must
              # stay *above* the exec: a comment inside the backslash-continued
              # command swallows every flag after it (measured with a stub).
              #
              # client bringup parity (adopted at R4): their
              # entrypoint sets --code-size-limit 99999 deliberately (the
              # margin-agent deploys exceed EIP-170 — discover it now, not at
              # runtime) and --transaction-block-keeper 1000000 (their failing-
              # run forensics read the run's own chain; keeper 2 makes a run
              # unreadable seconds after it ends). --hardfork stays bpo2 here
              # (V takes cancun — the real HyperEVM's fork).
              # Pre-launch mirror: the unoptimized creation code needs ~106.4M
              # gas for the largest deploy, above the production 60M block
              # limit. Raise the block limit until the optimized release build.
              exec anvil \
                --host 0.0.0.0 --port 8545 \
                --fork-url "$EVM_URL" \
                --fork-block-number "$PIN" \
                --chain-id 1 \
                --hardfork bpo2 \
                --gas-limit 300000000 \
                --enable-tx-gas-limit \
                --code-size-limit 99999 \
                --disable-pool-balance-checks \
                --order fifo \
                --no-mining \
                --auto-impersonate \
                --prune-history 32 \
                --transaction-block-keeper 1000000 \
                --no-rate-limit \
                --no-request-size-limit \
                --no-fork-node-info \
                --state /state/anvil-state.json \
                --state-interval 300 \
          # No config env: the fork source comes from the mounted
          # specialization file, read above. Only container plumbing remains.
          env:
            # Fork RPC cache (~/.foundry/cache/rpc/...) lands on the PVC and is
            # flushed on SIGTERM, so restarts keep the read-through warm.
            - { name: HOME, value: /state }
          ports:
            - { name: http, containerPort: 8545 }
          volumeMounts:
            - { name: state, mountPath: /state }
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
          # A restarted anvil re-forks before it can serve: gate
          # readiness/liveness behind a startup probe so k8s does not flap them
          # during the catch-up (measured: "Readiness probe failed: connection
          # refused" events on every restart).
          startupProbe:
            tcpSocket: { port: 8545 }
            periodSeconds: 5
            failureThreshold: 60 # up to 5 min to fork + catch up
          readinessProbe:
            # **Ready must mean serving, not merely listening.** The TCP probe
            # answers while anvil is mid-fork, so the pod reported Ready and
            # every dependent burned 30 s RPC timeouts against it (measured
            # 2026-11-18: the node was OOM-killed at 21:14Z, and the indexer's
            # chain-1 scans failed until 23:18Z). The exec probe runs the same
            # `eth_blockNumber` read the dependents' scans open with: Ready
            # only when the node answers reads.
            exec:
              command: ["/bin/sh", "-c", "cast block-number --rpc-url http://127.0.0.1:8545"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # TCP on purpose: an exec liveness would restart anvil mid-fork,
            # which is the one state it cannot survive usefully.
            tcpSocket: { port: 8545 }
            periodSeconds: 30
          resources:
            # T never executes mainnet txs (BAL diffs only), so its state stays
            # small (measured ~2.5 GB on disk with --prune-history 32; the
            # snapshots are the dominant term). Measured 2026-11-18: 4.0 GiB
            # RSS, 24 m CPU, and **two OOM kills at 21:14Z** — the node's
            # memory-pressure sweep ranked T near-BestEffort because the request
            # (2 Gi, the 2026-10-31 steady state) sat 2× under the working set.
            # The request now covers the measured steady state with headroom;
            # the limit stays the OOM ceiling for fork materialization spikes.
            requests: { cpu: "100m", memory: 8Gi }
            limits: { memory: 16Gi }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: anvil-t-state }
        - name: instance
          configMap: { name: mainnet-instance }
---
apiVersion: v1
kind: Service
metadata:
  name: anvil-t
  labels: { app.kubernetes.io/name: anvil-t, app.kubernetes.io/part-of: diorama-mainnet }
spec:
  selector: { app.kubernetes.io/name: anvil-t }
  ports:
    # anvil serves WebSocket upgrades on the same port as HTTP (the plan's A18:
    # "delivery is event-driven" - eth_subscribe over ws://...:8545).
    - { name: http, port: 8545, targetPort: 8545 }
