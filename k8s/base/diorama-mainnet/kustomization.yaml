# The Mainnet Mirror's manifest base: the devnet Anvil and the engine. Chain 1
# is read from the source host's reth over the LAN; there is no local reth or
# CL here. The namespace, the instance unit and the harness map are the
# overlay's (instance identity/topology, not service templates) — the same
# split as k8s/base/diorama-venue.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../shared
  - pvcs.yaml
  - anvil-t.yaml
  - engine.yaml
