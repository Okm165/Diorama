# The bridge's own state: watcher cursors + the in-flight message ledger.
# Owned by the bridge base, not by either mirror: a bridge can run beside a
# venue or in its own namespace, and a second bridge gets its own claim.
#
# The claim is deliberately portable (no `volumeName`): a standalone bridge in
# a fresh namespace must be able to bind a volume through the StorageClass.
# The local workshop's pre-bound claim is a deployment overlay concern, not a
# property every bridge inherits.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cctp-state
  labels: { app.kubernetes.io/part-of: diorama-cctp, app: cctp-bridge }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: diorama-retain
  resources:
    requests:
      storage: 5Gi
