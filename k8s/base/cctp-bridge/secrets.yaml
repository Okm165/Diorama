# The bridge's Secret inventory: the relay wallet's hex key (the wiring's
# `CCTP_RELAY_KEY`, marked `CCTP_RELAY_KEY_SECRET=1` and written by
# `make secrets` from the gitignored wiring.env). The values never enter git
# or a ConfigMap; the object exists (possibly empty) so the bridge never waits
# on a missing Secret - its secretKeyRef is `optional: true`.
apiVersion: v1
kind: Secret
metadata:
  name: diorama-cctp-secrets
  labels:
    app.kubernetes.io/part-of: diorama-cctp
type: Opaque
stringData: {}
