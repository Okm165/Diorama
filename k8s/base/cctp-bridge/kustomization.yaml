# The CCTP bridge's base: its deployment, service and own PVC. Included by
# the bridge's own overlay (`k8s/overlays/diorama-cctp`), never by a mirror's:
# a venue can run without a bridge, a bridge can run without the venue, and a
# deployment may run several bridges.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cctp-bridge.yaml
  - pvcs.yaml
