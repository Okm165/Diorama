# The local-source claims — declared only by the `local-reth` component.
#
# The base's pvcs.yaml deliberately holds no reth/lighthouse claims (the LAN
# source design); this file is the one other topology. `mirror-retain` keeps
# the 266 GB state across a stack delete — a re-source is never implicit.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reth-data
  labels: { app.kubernetes.io/part-of: diorama-mainnet, app: reth }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mirror-retain
  resources:
    requests:
      storage: 400Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lighthouse-data
  labels: { app.kubernetes.io/part-of: diorama-mainnet, app: lighthouse }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mirror-retain
  resources:
    requests:
      storage: 40Gi
