[package]
name = "diorama-devnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The devnet plane: shadow registry (COW), journal, state (epoch pins), metrics"

[dependencies]
diorama-anvil = { path = "../anvil" }
diorama-config = { path = "../config" }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-network-primitives = { workspace = true }
alloy-primitives = { workspace = true }
alloy-serde = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
# The shared engine shell owns the HTTP surface (handlers, route table,
# serve) and the error contract the mirrors implement.
axum = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }

[lints]
workspace = true
